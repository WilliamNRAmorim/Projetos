- btn_CancelarOpTubo_1:
    Control: Classic/Button@2.2.0
    Properties:
      BorderColor: =fx_CorErro
      BorderThickness: =1
      Color: =fx_CorErro
      DisplayMode: =If(IsBlank(gal_FilaTubo_1.Selected.ID) || varProcessando, DisplayMode.Disabled, DisplayMode.Edit)
      Fill: =fx_CorSuperficie
      Font: =fx_FonteFamilia
      FontWeight: =FontWeight.Semibold
      Height: =fx_AlturaAcao
      HoverFill: =fx_CorFundo
      OnSelect: |-
        =Reset(inp_MotivoCancTubo);
        UpdateContext({ctxModalCancTubo: true})
      PressedFill: =fx_CorFundo
      RadiusBottomLeft: =fx_RaioS
      RadiusBottomRight: =fx_RaioS
      RadiusTopLeft: =fx_RaioS
      RadiusTopRight: =fx_RaioS
      Size: =fx_FonteApoio
      Text: ="Cancelar OP"
      Visible: =fx_EstadoContinuo(gal_FilaTubo_1.Selected.status_processo) = "PRODUZINDO"
      Width: =108
      X: =1026
      Y: =700
- cntr_CancelarOpTubo:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      Fill: =fx_CorOverlay
      Height: =768
      Visible: =ctxModalCancTubo
      Width: =1366
    Children:
      - btn_BgCancTubo:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =Color.Transparent
            BorderThickness: =0
            Fill: =Color.Transparent
            Font: =fx_FonteFamilia
            Height: =768
            HoverFill: =Color.Transparent
            PressedFill: =Color.Transparent
            Text: =""
            Width: =1366
      - btn_CardCancTubo:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =fx_CorBorda
            BorderThickness: =1
            DisplayMode: =DisplayMode.View
            Fill: =fx_CorSuperficie
            Font: =fx_FonteFamilia
            Height: =380
            HoverFill: =fx_CorSuperficie
            PressedFill: =fx_CorSuperficie
            RadiusBottomLeft: =fx_RaioG
            RadiusBottomRight: =fx_RaioG
            RadiusTopLeft: =fx_RaioG
            RadiusTopRight: =fx_RaioG
            Text: =""
            Width: =560
            X: =403
            Y: =190
      - lbl_TituloCancTubo:
          Control: Label@2.5.1
          Properties:
            Color: =fx_CorErro
            Font: =fx_FonteFamilia
            FontWeight: =FontWeight.Bold
            Height: =34
            Size: =fx_FonteTitulo
            Text: ="Cancelar esta OP?"
            Width: =500
            X: =433
            Y: =214
      - lbl_SubCancTubo:
          Control: Label@2.5.1
          Properties:
            Color: =fx_CorTextoSuave
            Font: =fx_FonteFamilia
            Height: =72
            Size: =fx_FonteCorpo
            Text: ="A ficha é cancelada, o carretel de saída é liberado e o material que entrou volta para a fila do Tubo. Não dá para desfazer."
            Width: =500
            X: =433
            Y: =254
      - lbl_RotMotivoCancTubo:
          Control: Label@2.5.1
          Properties:
            Color: =fx_CorRotulo
            Font: =fx_FonteFamilia
            FontWeight: =FontWeight.Semibold
            Height: =20
            Size: =fx_FonteApoio
            Text: ="MOTIVO *"
            Width: =500
            X: =433
            Y: =340
      - inp_MotivoCancTubo:
          Control: Classic/TextInput@2.3.2
          Properties:
            AccessibleLabel: ="Motivo do cancelamento da OP"
            BorderColor: =If(IsBlank(Trim(Self.Text)), fx_CorErro, fx_CorBorda)
            Default: =""
            DelayOutput: =true
            Font: =fx_FonteFamilia
            Height: =fx_AlturaCampo
            HintText: ="Diga por que a OP está sendo cancelada"
            HoverFill: =fx_CorInfoSuave
            PaddingLeft: =10
            RadiusBottomLeft: =fx_RaioS
            RadiusBottomRight: =fx_RaioS
            RadiusTopLeft: =fx_RaioS
            RadiusTopRight: =fx_RaioS
            Size: =fx_FonteCorpo
            Width: =500
            X: =433
            Y: =362
      - btn_VoltarCancTubo:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =fx_CorBorda
            BorderThickness: =1
            Color: =fx_CorTextoSuave
            Fill: =fx_CorSuperficie
            Font: =fx_FonteFamilia
            Height: =fx_AlturaAcaoS
            HoverFill: =fx_CorFundo
            OnSelect: |-
              =Reset(inp_MotivoCancTubo);
              UpdateContext({ctxModalCancTubo: false})
            PressedFill: =fx_CorFundo
            RadiusBottomLeft: =fx_RaioS
            RadiusBottomRight: =fx_RaioS
            RadiusTopLeft: =fx_RaioS
            RadiusTopRight: =fx_RaioS
            Size: =fx_FonteCorpo
            Text: ="Voltar"
            Width: =180
            X: =433
            Y: =490
      - btn_ConfirmarCancTubo:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =Color.Transparent
            BorderThickness: =0
            Color: =fx_CorSuperficie
            DisabledFill: =fx_CorBorda
            DisplayMode: =If(!varProcessando && !IsBlank(Trim(inp_MotivoCancTubo.Text)), DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =fx_CorErro
            Font: =fx_FonteFamilia
            FontWeight: =FontWeight.Bold
            Height: =fx_AlturaAcaoS
            HoverFill: =ColorFade(fx_CorErro, -20%)
            OnSelect: |-
              =Set(varProcessando, true);
              Refresh(ficha_producao);
              Refresh(lista_carreteis);
              With(
                  {
                      _r: LookUp(ficha_producao, ID = gal_FilaTubo_1.Selected.ID),
                      _agora: Now(),
                      _turno: fx_TurnoEm(Now()),
                      _motivo: Trim(inp_MotivoCancTubo.Text),
                      _quem: Coalesce(cmb_OperadorTubo_1.Selected.Nome, gal_FilaTubo_1.Selected.operador_tubo, User().FullName)
                  },
                  If(
                      IsBlank(_r.ID),
                      Notify("Esta OP não existe mais no servidor. Atualize a tela.", NotificationType.Error, 8000);
                      Set(varProcessando, false),
                      _r.Modified <> gal_FilaTubo_1.Selected.Modified,
                      Notify("Registro alterado por outro usuário. A fila foi recarregada, tente de novo.", NotificationType.Error, 8000);
                      UpdateContext({ctxModalCancTubo: false});
                      Select(ico_RefreshTubo_1);
                      Set(varProcessando, false),
                      fx_EstadoContinuo(_r.status_processo) <> "PRODUZINDO",
                      Notify("Esta OP não está mais em processo. Atualize a tela.", NotificationType.Error, 8000);
                      UpdateContext({ctxModalCancTubo: false});
                      Select(ico_RefreshTubo_1);
                      Set(varProcessando, false),
                      IsBlank(_motivo),
                      Notify("Escreva o motivo antes de cancelar.", NotificationType.Warning, 6000);
                      Set(varProcessando, false),
                      Patch(
                          ficha_producao,
                          _r,
                          {
                              status_processo: "Cancelado",
                              data_hora_final_tubo: _agora,
                              Turno_Tubo: Text(_turno),
                              operador_tubo: _quem,
                              Observação_tubo: Trim(
                                  Coalesce(_r.Observação_tubo, "") &
                                  "  [OP CANCELADA " & Text(_agora, "[$-pt-BR]dd/mm hh:mm") &
                                  " por " & _quem & " - " & _motivo & "]"
                              )
                          }
                      );
                      If(
                          !IsEmpty(Errors(ficha_producao)),
                          Notify("Não cancelou a OP: " & First(Errors(ficha_producao)).Message, NotificationType.Error, 15000);
                          Set(varProcessando, false),
                          If(
                              !IsBlank(_r.'Carretel Saida') && !IsBlank(LookUp(lista_carreteis, Title = _r.'Carretel Saida').Title),
                              Patch(
                                  lista_carreteis,
                                  LookUp(lista_carreteis, Title = _r.'Carretel Saida'),
                                  {
                                      op: Blank(),
                                      etapa_processo: Blank(),
                                      metros_restantes: 0,
                                      mangueira_atual: Blank()
                                  }
                              );
                              If(
                                  !IsEmpty(Errors(lista_carreteis)),
                                  Notify("OP cancelada, mas o carretel de saída NÃO foi liberado. Libere na tela de carretéis: " & First(Errors(lista_carreteis)).Message, NotificationType.Error, 15000)
                              )
                          );
                          With(
                              { _entrada: Coalesce(_r.quantidade_mandril, 0) },
                              If(
                                  _entrada > 0,
                                  Set(
                                      gvarFilhoTubo,
                                      Patch(
                                          ficha_producao,
                                          Defaults(ficha_producao),
                                          {
                                              Title: _r.Title & " (devolvida)",
                                              processo: "Tubo",
                                              status_processo: "Aguardando",
                                              InicioAguardando_Tubo: _agora,
                                              'Carretel Entrada': _r.'Carretel Entrada',
                                              Bitola: _r.Bitola,
                                              cod_mandril: _r.cod_mandril,
                                              diametro_mandril: _r.diametro_mandril,
                                              quantidade_mandril: _entrada,
                                              operador_mandril: _r.operador_mandril,
                                              desmoldante_mandril: _r.desmoldante_mandril,
                                              lote_mandril: _r.lote_mandril,
                                              Observação_mandril: _r.Observação_mandril,
                                              data_hora_inicio_mandril: _r.data_hora_inicio_mandril,
                                              data_hora_final_mandril: _r.data_hora_final_mandril,
                                              Turno_mandril: _r.Turno_mandril,
                                              maquina_mandril: _r.maquina_mandril
                                          }
                                      )
                                  );
                                  If(
                                      !IsEmpty(Errors(ficha_producao)),
                                      Notify("ATENÇÃO: a OP foi cancelada, mas o material NÃO voltou para a fila do Tubo. Avise a supervisão.", NotificationType.Error, 15000),
                                      If(
                                          !IsBlank(_r.'Carretel Entrada') && !IsBlank(LookUp(lista_carreteis, Title = _r.'Carretel Entrada').Title),
                                          Patch(
                                              lista_carreteis,
                                              LookUp(lista_carreteis, Title = _r.'Carretel Entrada'),
                                              {
                                                  op: Text(gvarFilhoTubo.ID),
                                                  etapa_processo: "Tubo",
                                                  metros_restantes: _entrada,
                                                  mangueira_atual: Text(_r.Bitola)
                                              }
                                          );
                                          If(
                                              !IsEmpty(Errors(lista_carreteis)),
                                              Notify("Material voltou para a fila, mas o carretel de entrada NÃO foi marcado: " & First(Errors(lista_carreteis)).Message, NotificationType.Error, 15000)
                                          )
                                      )
                                  )
                              )
                          );
                          Patch(
                              Eventos_Producao,
                              Defaults(Eventos_Producao),
                              {
                                  Title: Text(_r.ID) & "-Tubo-Cancelado",
                                  origem: {Value: "ficha_producao"},
                                  origem_ID: _r.ID,
                                  etapa: {Value: "Tubo"},
                                  tipo: {Value: "Cancelado"},
                                  data_hora: _agora,
                                  data_ref: fx_DataRefEm(_agora),
                                  turno: _turno,
                                  bitola: _r.Bitola,
                                  metros: 0,
                                  sobra: Coalesce(_r.quantidade_mandril, 0),
                                  carretel: _r.'Carretel Saida',
                                  operador: _quem
                              }
                          );
                          If(
                              !IsEmpty(Errors(Eventos_Producao)),
                              Notify("OP cancelada, mas o evento NÃO gravou. O histórico fica sem o motivo: " & First(Errors(Eventos_Producao)).Message, NotificationType.Error, 15000)
                          );
                          Reset(inp_MotivoCancTubo);
                          Reset(gal_FilaTubo_1);
                          UpdateContext({ctxModalCancTubo: false});
                          Select(ico_RefreshTubo_1);
                          Set(varProcessando, false);
                          Notify("OP cancelada (" & _motivo & "). O material voltou para a fila do Tubo.", NotificationType.Success, 8000)
                      )
                  )
              )
            PressedFill: =ColorFade(fx_CorErro, -30%)
            RadiusBottomLeft: =fx_RaioS
            RadiusBottomRight: =fx_RaioS
            RadiusTopLeft: =fx_RaioS
            RadiusTopRight: =fx_RaioS
            Size: =fx_FonteCorpo
            Text: ="Cancelar a OP"
            Width: =220
            X: =713
            Y: =490
