Screens:
  scr_Finalização_1:
    Children:
      - btn_DividirPalletExt:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =fx_CorBorda
            BorderThickness: =1
            Color: =fx_CorTextoSuave
            DisplayMode: |-
              =If(
                  IsBlank(gal_FilaExt.Selected.ID) || IsEmpty(colLancesExt) || varProcessando,
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =fx_CorSuperficie
            Font: =fx_FonteFamilia
            Height: =30
            HoverFill: =fx_CorInfoSuave
            OnSelect: |-
              =ClearCollect(
                  colPalletSel,
                  ForAll(
                      Sequence(CountRows(colLancesExt)) As _i,
                      {
                          N: _i.Value,
                          ID: Index(colLancesExt, _i.Value).ID,
                          Qtd: Index(colLancesExt, _i.Value).Quantidade,
                          Sel: true
                      }
                  )
              );
              Reset(inp_PalletNumExt);
              Set(varModalPalletExt, true)
            PressedFill: =fx_CorInfoSuave
            RadiusBottomLeft: =fx_RaioS
            RadiusBottomRight: =fx_RaioS
            RadiusTopLeft: =fx_RaioS
            RadiusTopRight: =fx_RaioS
            Size: =fx_FonteApoio
            Text: ="Dividir pallet"
            Width: =89
            X: =1262
            Y: =676
      - cntr_PalletExt:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =fx_CorOverlay
            Height: =768
            Visible: =varModalPalletExt
            Width: =1366
          Children:
            - btn_BgPalletExt:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =fx_CorBorda
                  BorderThickness: =1
                  Color: =fx_CorTexto
                  DisplayMode: =DisplayMode.View
                  Fill: =fx_CorSuperficie
                  Font: =fx_FonteFamilia
                  Height: =540
                  HoverFill: =fx_CorSuperficie
                  PressedFill: =fx_CorSuperficie
                  RadiusBottomLeft: =fx_RaioG
                  RadiusBottomRight: =fx_RaioG
                  RadiusTopLeft: =fx_RaioG
                  RadiusTopRight: =fx_RaioG
                  Text: =""
                  Width: =520
                  X: =423
                  Y: =96
            - lbl_TituloPalletExt:
                Control: Label@2.5.1
                Properties:
                  Color: =fx_CorTexto
                  Font: =fx_FonteFamilia
                  FontWeight: =FontWeight.Bold
                  Height: =32
                  Size: =fx_FonteSecao
                  Text: ="Dividir pallet — lances deste Packing List"
                  Width: =456
                  X: =455
                  Y: =116
            - lbl_DicaPalletExt:
                Control: Label@2.5.1
                Properties:
                  Color: =fx_CorRotulo
                  Font: =fx_FonteFamilia
                  Height: =20
                  Size: =fx_FonteApoio
                  Text: ="Toque nos lances para marcar ou desmarcar. Só os marcados saem nesta ficha."
                  Width: =456
                  X: =455
                  Y: =150
            - gal_PalletExt:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =fx_CorBorda
                  Fill: =Color.Transparent
                  Height: =290
                  Items: =colPalletSel
                  TemplatePadding: =0
                  TemplateSize: =40
                  Width: =456
                  X: =455
                  Y: =176
                Children:
                  - btn_ItemPalletExt:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Align: =Align.Left
                        BorderColor: =If(ThisItem.Sel, fx_CorInfo, fx_CorBorda)
                        BorderThickness: =1
                        Color: =If(ThisItem.Sel, fx_CorTexto, fx_CorTextoSuave)
                        Fill: =If(ThisItem.Sel, fx_CorInfoSuave, fx_CorSuperficie)
                        Font: =fx_FonteFamilia
                        Height: =36
                        HoverFill: =fx_CorInfoSuave
                        OnSelect: |-
                          =Patch(colPalletSel, ThisItem, {Sel: !ThisItem.Sel})
                        PressedFill: =fx_CorInfoSuave
                        RadiusBottomLeft: =fx_RaioS
                        RadiusBottomRight: =fx_RaioS
                        RadiusTopLeft: =fx_RaioS
                        RadiusTopRight: =fx_RaioS
                        Size: =fx_FonteCorpo
                        Text: =If(ThisItem.Sel, "☑  ", "☐  ") & Text(ThisItem.N, "[$-en-US]0") & ".   " & fx_QtdBR(ThisItem.Qtd) & " m"
                        Width: =420
                        X: =8
                        Y: =2
            - lbl_ResumoPalletExt:
                Control: Label@2.5.1
                Properties:
                  Color: =fx_CorTexto
                  Font: =fx_FonteFamilia
                  FontWeight: =FontWeight.Bold
                  Height: =24
                  Size: =fx_FonteCorpo
                  Text: |-
                    =CountRows(Filter(colPalletSel, Sel)) & " de " & CountRows(colPalletSel) & " lances  ·  "
                    & fx_QtdBR(Coalesce(Sum(Filter(colPalletSel, Sel), Qtd), 0)) & " m"
                  Width: =456
                  X: =455
                  Y: =476
            - lbl_RotNumPalletExt:
                Control: Label@2.5.1
                Properties:
                  Color: =fx_CorRotulo
                  Font: =fx_FonteFamilia
                  FontWeight: =FontWeight.Semibold
                  Height: =20
                  Size: =fx_FonteApoio
                  Text: ="PALLET Nº"
                  Width: =100
                  X: =455
                  Y: =510
            - inp_PalletNumExt:
                Control: Classic/TextInput@2.3.2
                Properties:
                  AccessibleLabel: ="Número do pallet desta ficha"
                  BorderColor: =If(IsMatch(Self.Text, "^\d{1,2}$"), fx_CorBorda, fx_CorErro)
                  DelayOutput: =true
                  Font: =fx_FonteFamilia
                  Height: =fx_AlturaCampo
                  MaxLength: =2
                  PaddingLeft: =10
                  RadiusBottomLeft: =fx_RaioS
                  RadiusBottomRight: =fx_RaioS
                  RadiusTopLeft: =fx_RaioS
                  RadiusTopRight: =fx_RaioS
                  Size: =fx_FonteCorpo
                  Width: =100
                  X: =455
                  Y: =530
            - btn_InverterPalletExt:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =fx_CorBorda
                  BorderThickness: =1
                  Color: =fx_CorTexto
                  Fill: =fx_CorSuperficie
                  Font: =fx_FonteFamilia
                  Height: =fx_AlturaCampo
                  HoverFill: =fx_CorInfoSuave
                  OnSelect: |-
                    =ClearCollect(
                        colPalletTmp,
                        ForAll(colPalletSel As _p, {N: _p.N, ID: _p.ID, Qtd: _p.Qtd, Sel: !_p.Sel})
                    );
                    ClearCollect(colPalletSel, colPalletTmp)
                  PressedFill: =fx_CorInfoSuave
                  RadiusBottomLeft: =fx_RaioS
                  RadiusBottomRight: =fx_RaioS
                  RadiusTopLeft: =fx_RaioS
                  RadiusTopRight: =fx_RaioS
                  Size: =fx_FonteCorpo
                  Text: ="Inverter seleção"
                  Width: =160
                  X: =575
                  Y: =530
            - btn_CancelarPalletExt:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =fx_CorBorda
                  BorderThickness: =1
                  Color: =fx_CorTextoSuave
                  Fill: =fx_CorSuperficie
                  Font: =fx_FonteFamilia
                  Height: =fx_AlturaAcaoS
                  HoverFill: =fx_CorFundo
                  OnSelect: =Set(varModalPalletExt, false)
                  PressedFill: =fx_CorFundo
                  RadiusBottomLeft: =fx_RaioS
                  RadiusBottomRight: =fx_RaioS
                  RadiusTopLeft: =fx_RaioS
                  RadiusTopRight: =fx_RaioS
                  Size: =fx_FonteCorpo
                  Text: ="Cancelar"
                  Width: =170
                  X: =455
                  Y: =578
            - btn_ImprimirPalletExt:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =Color.Transparent
                  BorderThickness: =0
                  Color: =fx_CorSuperficie
                  DisabledFill: =fx_CorBorda
                  DisplayMode: |-
                    =If(
                        varProcessando
                        || CountRows(Filter(colPalletSel, Sel)) = 0
                        || CountRows(Filter(colPalletSel, Sel)) > 26
                        || !IsMatch(inp_PalletNumExt.Text, "^\d{1,2}$"),
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  Fill: =fx_CorInfo
                  Font: =fx_FonteFamilia
                  FontWeight: =FontWeight.Bold
                  Height: =fx_AlturaAcaoS
                  HoverFill: =ColorFade(fx_CorInfo, -20%)
                  OnSelect: |-
                    =ClearCollect(colPalletImp, Filter(colPalletSel, Sel));
                    Set(varFichaIDImp, gal_FilaExt.Selected.ID);
                    Set(varPackingManual, false);
                    Set(VarMangueiraOP, gal_FilaExt.Selected.OP);
                    Set(varMangueiraImp, gal_FilaExt.Selected.Mangueira);
                    Set(varPalletTxt, "  ·  PALLET " & Text(Value(inp_PalletNumExt.Text), "[$-en-US]0"));
                    Set(varTotalImp, fx_QtdBR(Coalesce(Sum(colPalletImp, Qtd), 0)));
                    Set(
                        varHTMLLances,
                        "<table style='border-collapse:collapse;width:100%'>"
                        & "<tr style='background:#d0d0d0'><th style='border:1px solid #000;padding:10px 12px;font-size:20px;width:8%'>N°</th><th style='border:1px solid #000;padding:10px 12px;font-size:20px;width:27%'>QTY (m)</th><th style='border:1px solid #000;padding:10px 12px;font-size:20px;width:8%'>N°</th><th style='border:1px solid #000;padding:10px 12px;font-size:20px'>QTY (m)</th></tr>"
                        & Concat(
                            ForAll(
                                Sequence(13) As _i,
                                {
                                    linha:
                                        "<tr><td style='border:1px solid #000;padding:10px 12px;font-size:20px'>"
                                        & Text(_i.Value, "[$-en-US]0")
                                        & "</td><td style='border:1px solid #000;padding:10px 12px;font-size:20px'>"
                                        & If(
                                            CountRows(colPalletImp) >= _i.Value,
                                            fx_QtdBR(Index(colPalletImp, _i.Value).Qtd),
                                            "0,00"
                                        )
                                        & "</td><td style='border:1px solid #000;padding:10px 12px;font-size:20px'>"
                                        & Text(_i.Value + 13, "[$-en-US]0")
                                        & "</td><td style='border:1px solid #000;padding:10px 12px;font-size:20px'>"
                                        & If(
                                            CountRows(colPalletImp) >= _i.Value + 13,
                                            fx_QtdBR(Index(colPalletImp, _i.Value + 13).Qtd),
                                            "0,00"
                                        )
                                        & "</td></tr>"
                                }
                            ),
                            linha
                        )
                        & "</table>"
                    );
                    Set(varModalPalletExt, false);
                    Navigate(TelaImpressao, ScreenTransition.None)
                  PressedFill: =ColorFade(fx_CorInfo, -30%)
                  RadiusBottomLeft: =fx_RaioS
                  RadiusBottomRight: =fx_RaioS
                  RadiusTopLeft: =fx_RaioS
                  RadiusTopRight: =fx_RaioS
                  Size: =fx_FonteCorpo
                  Text: ="Imprimir este pallet"
                  Width: =261
                  X: =650
                  Y: =578
