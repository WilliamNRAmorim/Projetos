mcs.metadata:
  componentName: "List collaborator records from SharePoint table with filtering  "
  description: This capability retrieves records from the 'Colaboradores' table in the specified SharePoint site, allowing optional filtering.
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: dataset
    value: https://danfoss.sharepoint.com/sites/OperationsGuaratingueta

  - kind: ManualTaskInput
    propertyName: table
    value: Colaboradores

  - kind: AutomaticTaskInput
    propertyName: "'$filter'"
    description: Enter an OData style filter expression to limit which rows are listed
    shouldPromptUser: false

modelDisplayName: "List collaborator records from SharePoint table with filtering  "
modelDescription: This capability retrieves records from the 'Colaboradores' table in the specified SharePoint site, allowing optional filtering.
action:
  kind: InvokeConnectorTaskAction
  connectionReference: cra6eb_uiu_gms.connectionreference.SharePointCrb333ea9016
  connectionProperties:
    name: cra6eb_uiu_gms.connectionreference.SharePointCrb333ea9016
    mode: Maker

  operationId: GetItems