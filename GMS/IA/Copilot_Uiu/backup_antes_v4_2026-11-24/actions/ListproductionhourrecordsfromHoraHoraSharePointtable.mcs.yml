mcs.metadata:
  componentName: "List production hour records from Hora-Hora SharePoint table  "
  description: This capability retrieves records from the 'Hora-Hora' table in the specified SharePoint site, allowing optional filtering.
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: dataset
    value: https://danfoss.sharepoint.com/sites/OperationsGuaratingueta

  - kind: ManualTaskInput
    propertyName: table
    value: Hora-Hora

  - kind: AutomaticTaskInput
    propertyName: "'$filter'"
    description: Enter an OData style filter expression to limit which rows are listed
    shouldPromptUser: false

  - kind: ManualTaskInput
    propertyName: "'$top'"
    value: 1000

modelDisplayName: "List production hour records from Hora-Hora SharePoint table  "
modelDescription: This capability retrieves records from the 'Hora-Hora' table in the specified SharePoint site, allowing optional filtering.
outputs:
  - propertyName: value
    name: value
    description: List of Items

