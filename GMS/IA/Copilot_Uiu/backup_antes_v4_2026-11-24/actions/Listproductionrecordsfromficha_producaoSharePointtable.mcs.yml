mcs.metadata:
  componentName: "List production records from ficha_producao SharePoint table  "
  description: This capability lists production records from the 'ficha_producao' SharePoint table at the specified site, allowing filtering via OData expressions.
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: dataset
    value: https://danfoss.sharepoint.com/sites/OperationsGuaratingueta

  - kind: ManualTaskInput
    propertyName: table
    value: ficha_producao

  - kind: AutomaticTaskInput
    propertyName: "'$filter'"
    description: Enter an OData style filter expression to limit which rows are listed
    shouldPromptUser: false

  - kind: ManualTaskInput
    propertyName: "'$top'"
    value: =1000

modelDisplayName: "List production records from ficha_producao SharePoint table  "
modelDescription: This capability lists production records from the 'ficha_producao' SharePoint table at the specified site, allowing filtering via OData expressions.
