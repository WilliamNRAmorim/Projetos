mcs.metadata:
  componentName: "Retrieve specific extrusion scrap record from RefugoExtrusora_estrutura table  "
  description: This capability retrieves a specific record from the RefugoExtrusora_estrutura table in the Operations Guaratingueta SharePoint site using the SharePoint Online connector. It uses the fixed dataset URL and table name to fetch the item, enabling access to detailed data from the RefugoExtrusora_estrutura table.
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: dataset
    value: https://danfoss.sharepoint.com/sites/OperationsGuaratingueta

  - kind: ManualTaskInput
    propertyName: table
    value: RefugoExtrusora_estrutura

modelDisplayName: Get extrusion scrap record from RefugoExtrusora_estrutura
modelDescription: This capability retrieves a specific record from the RefugoExtrusora_estrutura table in the Operations Guaratingueta SharePoint site using the SharePoint Online connector. It uses the fixed dataset URL and table name to fetch the item, enabling access to detailed data from the RefugoExtrusora_estrutura table.
action:
  kind: InvokeConnectorTaskAction
  connectionReference: cra6eb_uiu_gms.connectionreference.SharePointCrb333ea9016
  connectionProperties:
    name: cra6eb_uiu_gms.connectionreference.SharePointCrb333ea9016
    mode: Maker

  operationId: GetItem