mcs.metadata:
  componentName: Fallback
  description: This system topic triggers when the user's utterance does not match any existing topics.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_LktzXw
      conditions:
        - id: conditionItem_tlGIVo
          condition: =System.FallbackCount < 3
          actions:
            - kind: SendActivity
              id: sendMessage_QZreqo
              activity: "Desculpe, não entendi. Pode perguntar de outro jeito? (Ex.: OP X, turno atual, refugo do mês, parada da TH07.)"

      elseActions:
        - kind: BeginDialog
          id: 5aXj5M
          dialog: cra6eb_uiu_gms.topic.Escalate