<!doctype html><html><head><meta charset="utf-8"><title>carregando</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="capas-saga-dados.js"></script></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>

const ICO={

 ave(c){g.fillStyle=c;g.beginPath();g.moveTo(-260,40);g.quadraticCurveTo(-120,-190,0,-30);g.quadraticCurveTo(120,-190,260,40);g.quadraticCurveTo(110,-20,0,100);g.quadraticCurveTo(-110,-20,-260,40);g.fill();g.fillRect(-4,60,8,170)},

 giz(c){g.strokeStyle=c;g.lineWidth=14;g.lineCap='round';g.beginPath();g.arc(0,0,240,0,7);g.stroke();g.beginPath();g.arc(0,0,170,0.3,5.9);g.stroke();for(let i=0;i<5;i++){const a=i*1.2566;g.beginPath();g.moveTo(Math.cos(a)*190,Math.sin(a)*190);g.lineTo(Math.cos(a+2.5)*190,Math.sin(a+2.5)*190);g.stroke()}},
 mao(c){g.fillStyle=c;g.beginPath();g.roundRect(-110,0,220,230,40);g.fill();[[-110,-40,-14],[-55,-120,-4],[0,-150,0],[55,-125,5],[110,-60,20]].forEach(([x,y,r])=>{g.save();g.translate(x,y);g.rotate(r*Math.PI/180);g.beginPath();g.roundRect(-24,-10,48,y<-100?150:130,22);g.fill();g.restore()});g.fillStyle='#000';g.fillRect(-90,150,180,10)},

 estrada(c){g.fillStyle=c;g.beginPath();g.moveTo(-40,-230);g.lineTo(40,-230);g.lineTo(300,240);g.lineTo(-300,240);g.fill();g.fillStyle='#000';for(let i=0;i<5;i++){const y=-190+i*85,w=6+i*9;g.fillRect(-w/2,y,w,38+i*10)}},

 carta(c){g.fillStyle=c;g.beginPath();g.roundRect(-150,-230,300,460,28);g.fill();g.fillStyle='#000';g.beginPath();g.arc(0,0,70,0,7);g.fill();g.fillStyle=c;g.beginPath();g.arc(0,0,38,0,7);g.fill();g.fillStyle='#000';g.fillRect(-10,-170,20,70);g.fillRect(-10,100,20,70)},
 cuia(c){g.fillStyle=c;g.beginPath();g.arc(0,-40,230,0,Math.PI);g.fill();g.fillStyle='#000';g.beginPath();g.ellipse(0,-40,230,40,0,0,7);g.fill();g.strokeStyle=c;g.lineWidth=10;g.globalAlpha=.6;g.beginPath();g.ellipse(0,-40,230,40,0,0,7);g.stroke();g.globalAlpha=1;g.fillStyle=c;g.fillRect(-250,230,500,8)},
 velas(c){for(let i=-2;i<=2;i++){const x=i*105,y=40+Math.abs(i)*40;g.fillStyle=c;g.fillRect(x-20,y,40,150);glow(x,y-30,100,'#FFC060',.8);g.fillStyle='#FFD98A';g.beginPath();g.ellipse(x,y-26,14,30,0,0,7);g.fill()}},
 interfone(c){g.fillStyle=c;g.beginPath();g.roundRect(-160,-240,320,480,30);g.fill();g.fillStyle='#000';g.beginPath();g.roundRect(-110,-190,220,120,12);g.fill();g.fillStyle=c;g.font='700 100px Impact';g.textAlign='center';g.fillText('403',0,-92);g.fillStyle='#000';for(let r=0;r<3;r++)for(let k=0;k<3;k++){g.beginPath();g.arc(-70+k*70,-10+r*70,22,0,7);g.fill()}},
 pendulo(c){g.strokeStyle=c;g.lineWidth=10;g.beginPath();g.moveTo(0,-330);g.lineTo(0,-30);g.stroke();g.fillStyle=c;g.beginPath();g.moveTo(-250,-20);g.quadraticCurveTo(0,240,250,-20);g.quadraticCurveTo(0,60,-250,-20);g.fill();g.globalAlpha=.3;g.beginPath();g.arc(0,-330,340,0.45*Math.PI,0.55*Math.PI+.4);g.globalAlpha=1},
 vela(c){g.fillStyle=c;g.fillRect(-45,-20,90,260);glow(0,-110,170,'#FFC060',.9);g.fillStyle='#FFD98A';g.beginPath();g.moveTo(0,-190);g.quadraticCurveTo(50,-100,0,-50);g.quadraticCurveTo(-50,-100,0,-190);g.fill();g.fillStyle='#000';g.fillRect(-4,-40,8,28)},
 redemoinho(c){g.strokeStyle=c;g.lineWidth=18;g.lineCap='round';g.beginPath();for(let t=0;t<22;t+=.05){const r=10+t*12,a=t*.9;g.lineTo(Math.cos(a)*r,Math.sin(a)*r*.5-t*8+80)}g.stroke()},
 recibo(c){g.fillStyle=c;g.beginPath();g.moveTo(-170,-240);g.lineTo(170,-240);g.lineTo(170,240);for(let i=0;i<7;i++)g.lineTo(170-(i+.5)*(340/7),i%2?240:200);g.lineTo(-170,240);g.fill();g.fillStyle='#000';for(let i=0;i<6;i++)g.fillRect(-120,-190+i*58,i==5?100:240,18)},
 olho(c){g.fillStyle=c;g.beginPath();g.moveTo(-290,0);g.quadraticCurveTo(0,-250,290,0);g.quadraticCurveTo(0,250,-290,0);g.fill();g.fillStyle='#000';g.beginPath();g.arc(0,0,105,0,7);g.fill();g.fillStyle=c;g.beginPath();g.arc(-30,-30,22,0,7);g.fill()},
 barco(c){g.fillStyle=c;g.beginPath();g.moveTo(-290,60);g.lineTo(290,60);g.lineTo(220,190);g.lineTo(-220,190);g.fill();g.fillRect(-170,-90,340,150);g.fillStyle='#000';[-110,-35,40,115].forEach(x=>g.fillRect(x-4,-50,50,50));glow(-290,60,120,c,.5);g.fillStyle='#FF3030';[[-200,-160],[-150,-160]].forEach(([x,y])=>{g.beginPath();g.arc(x+330,y+60,26,0,7);g.fill()})},
 celular(c){g.fillStyle=c;g.beginPath();g.roundRect(-140,-250,280,500,36);g.fill();g.fillStyle='#000';g.beginPath();g.roundRect(-118,-216,236,430,20);g.fill();g.strokeStyle=c;g.lineWidth=10;g.lineCap='round';g.beginPath();for(let x=-90;x<=90;x+=15)g.lineTo(x,Math.sin(x*.18)*(30+Math.abs(x)*.5)-10);g.stroke()},
 foto(c){g.fillStyle=c;g.beginPath();g.roundRect(-280,-190,560,380,16);g.fill();g.fillStyle='#000';g.fillRect(-250,-160,500,320);g.fillStyle=c;for(let i=0;i<7;i++){const x=-210+i*70;g.beginPath();g.arc(x,-30+(i%2)*20,26,0,7);g.fill();g.fillRect(x-24,-4+(i%2)*20,48,110)};g.fillStyle='#FF3030';g.beginPath();g.arc(215,-70,26,0,7);g.fill()},
 ponte(c){g.strokeStyle=c;g.lineWidth=20;g.beginPath();g.moveTo(-300,40);g.lineTo(300,40);g.stroke();g.beginPath();g.moveTo(-300,40);g.quadraticCurveTo(0,-160,300,40);g.stroke();g.lineWidth=8;for(let x=-240;x<=240;x+=60){g.beginPath();g.moveTo(x,40);g.lineTo(x,-80+Math.abs(x)*.28);g.stroke()}g.lineWidth=12;g.beginPath();g.moveTo(0,40);g.lineTo(0,180);g.stroke();g.beginPath();g.arc(0,200,22,0,7);g.stroke()},
 costas(c){g.fillStyle=c;g.beginPath();g.arc(0,-190,80,0,7);g.fill();g.beginPath();g.moveTo(-250,240);g.quadraticCurveTo(-230,-90,0,-100);g.quadraticCurveTo(230,-90,250,240);g.fill();g.fillStyle='#000';g.beginPath();g.ellipse(0,40,55,95,0,0,7);g.fill()},
 olhosbrasa(c){[-125,125].forEach(x=>{glow(x,0,170,c,.8);g.fillStyle=c;g.beginPath();g.moveTo(x-95,0);g.quadraticCurveTo(x,-80,x+95,0);g.quadraticCurveTo(x,80,x-95,0);g.fill();g.fillStyle='#000';g.beginPath();g.ellipse(x,0,22,60,0,0,7);g.fill()})},
 caderno(c){g.fillStyle=c;g.beginPath();g.roundRect(-180,-250,360,500,18);g.fill();g.fillStyle='#000';for(let i=0;i<8;i++)g.fillRect(-140,-190+i*55,i==7?120:280,8);g.fillStyle='#000';g.fillRect(-180,-250,26,500)},
 copo(c){g.strokeStyle=c;g.lineWidth=18;g.lineJoin='round';g.beginPath();g.moveTo(-120,-220);g.lineTo(-90,220);g.lineTo(90,220);g.lineTo(120,-220);g.stroke();g.lineWidth=7;g.globalAlpha=.7;g.beginPath();g.moveTo(-107,-60);g.lineTo(107,-60);g.stroke();g.globalAlpha=1},
 cova(c){g.fillStyle=c;g.beginPath();g.ellipse(0,140,280,70,0,0,7);g.fill();g.fillStyle='#000';g.beginPath();g.ellipse(0,150,170,38,0,0,7);g.fill();glow(0,-30,200,c,.9);g.fillStyle='#FFE08A';g.beginPath();g.arc(0,-30,45,0,7);g.fill();g.strokeStyle=c;g.lineWidth=16;g.beginPath();g.moveTo(200,-200);g.lineTo(140,120);g.stroke()},
 pegadas(c){g.fillStyle=c;for(let i=0;i<5;i++){const x=(i%2?60:-60)+(i-2)*0,y=-220+i*105;g.beginPath();g.ellipse(x,y,38,62,0,0,7);g.fill();for(let k=0;k<4;k++){g.beginPath();g.arc(x-30+k*20,y-82+(k==1||k==2?-8:0),9,0,7);g.fill()}}},
 sombra(c){g.fillStyle='#000';g.strokeStyle=c;g.lineWidth=10;g.beginPath();g.arc(-150,-170,52,0,7);g.fill();g.stroke();g.beginPath();g.roundRect(-205,-110,110,210,34);g.fill();g.stroke();g.fillStyle=hex(c,.35);g.beginPath();g.moveTo(-100,180);g.lineTo(70,230);g.lineTo(290,230);g.lineTo(190,170);g.fill();g.beginPath();g.arc(250,200,40,0,7);g.fill()}
};
function draw(P){
 const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,P.bg);bg.addColorStop(1,'#000');g.fillStyle=bg;g.fillRect(0,0,W,H);
 glow(540,820,820,P.cor,.30);
 // faixa de tipo
 g.textAlign='center';g.fillStyle=P.cor;g.font='700 46px Oswald, Impact, sans-serif';g.letterSpacing='8px';
 g.fillText('PORTO SERENO',540,270);
 g.font='700 40px Oswald, Impact, sans-serif';g.letterSpacing='6px';g.fillStyle='#fff';
 g.fillText(P.tipo+(P.fonte?'  ·  '+P.fonte:''),540,330);
 // icone
 g.save();g.translate(540,760);g.scale(0.82,0.82);g.shadowColor=P.cor;g.shadowBlur=60;ICO[P.ico](P.cor);g.restore();
 // texto grande (zona segura 1920: y 1080 a 1560)
 const n=P.l.length,sz=n>=3?190:230,lh=sz*1.02,y0=1180;
 P.l.forEach((t,i)=>{let s=sz;g.font=`${s}px Impact, Oswald, sans-serif`;g.letterSpacing='2px';while(g.measureText(t).width>980&&s>90){s-=6;g.font=`${s}px Impact, Oswald, sans-serif`}
  const y=y0+i*lh;g.lineJoin='round';g.lineWidth=26;g.strokeStyle='#000';g.strokeText(t,540,y);g.fillStyle=i===P.d?P.cor:'#fff';g.fillText(t,540,y)});
 g.font='700 38px Oswald, Impact, sans-serif';g.letterSpacing='6px';g.fillStyle=hex('#ffffff',.7);g.fillText('A SAGA EM 28 EPISÓDIOS',540,1700);
 // vinheta e grao
 const v=g.createRadialGradient(540,960,500,540,960,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.65)');g.fillStyle=v;g.fillRect(0,0,W,H);
 g.globalAlpha=.05;for(let i=0;i<6000;i++){g.fillStyle=Math.random()<.5?'#fff':'#000';g.fillRect(Math.random()*W,Math.random()*H,3,3)}g.globalAlpha=1;
}
(async()=>{try{
 try{await document.fonts.load('700 40px "Oswald"')}catch(e){}
 if(sheet){cv.width=W*7/4;}
 draw(window.CAPAS[idx]);document.title='ready';
}catch(e){document.title='erro '+e;document.body.innerText='ERRO '+e}})();
</script></body></html>
