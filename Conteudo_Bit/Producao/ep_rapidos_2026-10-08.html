<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>rapidos 08-10</title>
<script src="brand.js"></script><script src="bit_art.js"></script><script src="ep_kit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>document.write(`<link rel="stylesheet" href="${BRAND.fontsCSS}">`)</script>
<style>body{margin:0;background:#222;padding:16px}canvas{width:360px}</style></head><body>
<script>
// Fatos rápidos de quinta 08/10 (sem narração: texto no ritmo de leitura + trilha). ?v=wifi | ?v=ia ; ?sheet=1 confere ; ?save=1 renderiza.
// Fontes: Wi-Fi: TechRadar / Interbrand / entrevista de Phil Belanger (Boing Boing, 2005). IA nos games: Pesquisa Game Brasil 2026 (Omelete).
const { W, H, clamp, out, txt, glitch } = EpKit;
const P = BRAND.paper, A = BRAND.accent, MU = BRAND.mute, I2 = BRAND.ink2, OK = '#3DDC97';
const q = new URLSearchParams(location.search), V = q.get('v') || 'wifi';
let bit;
function rot(g, s, y = 300, col = A) { txt(g, s, 90, y, 30, col, { mono: true, w: 700 }); }
function wifi(g, cx, cy, s, col) { g.strokeStyle = col; g.lineCap = 'round'; for (let i = 1; i <= 3; i++) { g.lineWidth = 26 * s; g.beginPath(); g.arc(cx, cy, 70 * i * s, -Math.PI * 0.78, -Math.PI * 0.22); g.stroke(); } g.fillStyle = col; g.beginPath(); g.arc(cx, cy, 20 * s, 0, 7); g.fill(); }
const EP = {
  wifi: {
    out: 'Qui08_B_TikTok_Instagram_WiFi.mp4',
    falas: [
      { cena: 'mito', acc: ['Wireless', 'Fidelity.'], txt: 'Você passou a vida inteira achando que Wi-Fi significa Wireless Fidelity.' },
      { cena: 'nada', acc: ['nada.'], txt: 'Não significa. Wi-Fi não significa nada.' },
      { cena: 'agencia', acc: ['soava', 'bem.'], txt: 'Em 1999, uma agência de marcas inventou o nome só porque soava bem. Tipo hi-fi.' },
      { cena: 'slogan', acc: ['erro.'], txt: 'O "Wireless Fidelity" foi um slogan colado depois. E até quem estava lá disse que foi um erro.' },
      { cena: 'fim', acc: ['marketing', 'puro.'], txt: 'Ou seja: o nome mais falado da sua casa é marketing puro.' },
    ],
    cenas: {
      mito(g, u, k) { rot(g, 'O QUE TE CONTARAM'); wifi(g, W / 2, 900, 1.6, P); txt(g, 'Wi-Fi =', 90, 1080, 110, P); txt(g, 'Wireless Fidelity', 90, 1200, 96, P); },
      nada(g, u, k, fr) { rot(g, 'A VERDADE'); wifi(g, W / 2, 900, 1.6, '#2A2A2E'); txt(g, 'Wi-Fi =', 90, 1080, 110, P);
        glitch(g, (dx, dy, c) => txt(g, 'nada.', 90 + dx, 1230, 190, c || A), clamp(1 - u / 0.6) * 0.8, fr);
        g.strokeStyle = A; g.lineWidth = 10; g.beginPath(); g.moveTo(80, 1170); g.lineTo(80 + 900 * out(clamp(u / 0.4)), 1140); g.stroke(); },
      agencia(g, u, k) { rot(g, '1999 · AGÊNCIA INTERBRAND');
        // 10 nomes propostos (Belanger): só o escolhido aparece; os outros ficam como barras, sem inventar nomes
        txt(g, '10 NOMES PROPOSTOS', 90, 400, 30, MU, { mono: true, w: 700 });
        for (let i = 0; i < 6; i++) { const a = clamp((k * 1.6 - i * 0.12) * 4); if (a <= 0) continue; const y = 470 + i * 110, win = i === 3;
          g.globalAlpha = win ? 1 : a * (k > 0.7 ? 0.25 : 0.7);
          if (win) { txt(g, 'Wi-Fi', 90, y, 80, k > 0.7 ? A : P); if (k > 0.7) txt(g, '✓', 360, y, 80, OK); } else { g.fillStyle = '#2A2A2E'; g.fillRect(90, y - 60, 260 + (i * 97 % 220), 64); }
          g.globalAlpha = 1; }
        txt(g, '"wi-fi" soa como "hi-fi"', 90, 1210, 40, MU, { mono: true, w: 500 }); },
      slogan(g, u, k) { rot(g, 'O SLOGAN (2000)');
        g.fillStyle = I2; g.fillRect(90, 520, W - 180, 330); g.strokeStyle = '#2A2A2E'; g.lineWidth = 2; g.strokeRect(90, 520, W - 180, 330);
        txt(g, '"The Standard for', 140, 650, 66, P); txt(g, 'Wireless Fidelity"', 140, 740, 66, P);
        if (k > 0.55) { const a = clamp((k - 0.55) / 0.1), sc = 1 + (1 - out(a)) * 0.5; g.save(); g.translate(W / 2, 960); g.rotate(-0.07); g.scale(sc, sc); g.globalAlpha = a; g.strokeStyle = A; g.lineWidth = 8; g.strokeRect(-200, -70, 400, 120); txt(g, 'ERRO', 0, 20, 90, A, { align: 'center', mono: true, w: 700 }); g.restore(); } },
      fim(g, u) { wifi(g, 330, 900, 1.3, A); BitArt.draw(g, bit, 790, 1290, 560); txt(g, 'MARKETING PURO', 90, 300, 30, A, { mono: true, w: 700 }); },
    },
    musica: () => 0.24,
  },
  ia: {
    out: 'Qui08_C_TikTok_IAnosGames.mp4',
    falas: [
      { cena: 'medo', acc: ['medo', 'IA'], txt: 'Pesquisa nova: quase metade dos gamers brasileiros tem medo da IA nos jogos.' },
      { cena: 'porque', acc: ['empregos'], txt: 'O medo: perder empregos e a criatividade virar linha de produção.' },
      { cena: 'mas', acc: ['contradição:'], txt: 'Mas olha a contradição:' },
      { cena: 'compra', acc: ['comprariam'], txt: '39% comprariam um jogo feito por IA. E outros 41% talvez.' },
      { cena: 'voce', acc: ['Jogaria?'], txt: 'E você? Jogaria?' },
    ],
    cenas: {
      medo(g, u, k) { rot(g, 'PESQUISA GAME BRASIL 2026'); const n = (45.7 * out(clamp(u / 1.2))).toFixed(1).replace('.', ','); txt(g, n + '%', 90, 900, 260, A); txt(g, 'têm medo da IA nos games', 90, 1010, 54, P); },
      porque(g, u, k) { rot(g, 'O MEDO');
        [['perder empregos', 0.1], ['criatividade em série', 0.5]].forEach(([s, at], i) => { const a = clamp((k - at) / 0.1); if (a <= 0) return; g.globalAlpha = a; g.fillStyle = I2; g.fillRect(90, 560 + i * 230, W - 180, 180); txt(g, s, 130, 680 + i * 230, 76, P); g.globalAlpha = 1; }); },
      mas(g, u, k, fr) { glitch(g, (dx, dy, c) => txt(g, 'MAS…', W / 2 + dx, 980, 260, c || A, { align: 'center' }), clamp(1 - u / 0.8) * 0.7, fr); },
      compra(g, u, k) { rot(g, 'AO MESMO TEMPO');
        const bar = (y, pct, lab, col, at) => { const a = out(clamp((k - at) / 0.25)); g.fillStyle = I2; g.fillRect(90, y, W - 180, 120); g.fillStyle = col; g.fillRect(90, y, (W - 180) * pct / 100 * a, 120); txt(g, lab, 120, y + 85, 60, BRAND.ink); };
        bar(560, 39.3, '39,3% comprariam', A, 0.05); bar(760, 40.9, '40,9% talvez', P, 0.45);
        txt(g, 'jogo feito por IA', 90, 1000, 54, MU, { mono: true, w: 500 }); },
      voce(g, u) { txt(g, 'E você?', 90, 700, 190, P); txt(g, 'Jogaria?', 90, 900, 190, A); BitArt.draw(g, bit, 800, 1360, 480); },
    },
    musica: () => 0.24,
  },
}[V];
EpKit.run({
  falas: EP.falas, cenas: EP.cenas, semVoz: true, gap: 0.25, tail: 0.8, grao: 0.04, bitrate: 2.4e6,
  dir: 'semana-2026-10-05', out: EP.out, musica: EP.musica,
  prep: async () => { bit = await BitArt.load('/Marca/bit/bit_pensando.png'); },
}).catch(e => document.title = 'ERROR ' + e.message);
</script></body></html>
