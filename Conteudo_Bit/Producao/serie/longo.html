<script>

const LISTA = [ // ordem de exibição (escolha editorial: sem dados de retenção ainda)

  ['contos-dia2/06_loira_do_banheiro_v2.mp4', 'Loira do banheiro', 'Lenda urbana'],

const q = new URLSearchParams(location.search), render = q.has('render');

  try {

      for (let i = 0; i < L.length; i++) { const a = Math.max(Math.abs(L[i]), Math.abs(R[i])); if (a > pk) pk = a; if (a > 0.01) ult = i; }

    }

    const iv = await ac.decodeAudioData(await (await fetch('../stems/serie/longo/intro.mp3')).arrayBuffer());
    const INTRO = Math.max(10, iv.duration + 1.4 + 0.6);

    let t = INTRO + GAP; for (const s of segs) { s.t0 = t; t += s.dur + GAP; } const DUR = t, N = LISTA.length;
    const len = Math.ceil(DUR * SR), AL = new Float32Array(len), AR = new Float32Array(len);
    // intro sonora
    const iL = iv.getChannelData(0); for (let i = 0; i < iL.length; i++) { const k = Math.round(1.4 * SR) + i; if (k < len) { AL[k] += iL[i] * 1.1; AR[k] += iL[i] * 1.1; } }
    for (let i = 0; i < INTRO * SR; i++) { const tt = i / SR, env = clamp(tt / 3) * clamp((INTRO - tt) / 1.2), d = Math.sin(2 * Math.PI * 55 * tt) * 0.5 + Math.sin(2 * Math.PI * 82.5 * tt + Math.sin(tt * 0.7)) * 0.3, v = d * 0.10 * env;
      const b = tt % 1.6, hb = (Math.exp(-b * 18) + 0.7 * Math.exp(-Math.max(0, b - 0.25) * 22) * (b > 0.25 ? 1 : 0)) * Math.sin(2 * Math.PI * 48 * b) * 0.22 * clamp((tt - 4) / 3) * clamp((INTRO - tt) / 0.8); AL[i] += v + hb; AR[i] += v + hb; }
    for (const s of segs) { const n = Math.round(s.dur * SR), a0 = Math.round(s.t0 * SR);

      // batida grave de corte na entrada do conto

    let pk2 = 0, clip = 0; for (let i = 0; i < len; i++) { const m = Math.max(Math.abs(AL[i]), Math.abs(AR[i])); if (m > pk2) pk2 = m; } const g2 = pk2 > 0.89 ? 0.89 / pk2 : 1; if (g2 < 1) for (let i = 0; i < len; i++) { AL[i] *= g2; AR[i] *= g2; }

    const caps = [{ t: 0, nome: 'Intro' }, ...segs.map((s, i) => ({ t: +s.t0.toFixed(1), nome: `${i + 1}. ${s.nome} (${s.tipo})` }))];

    // 4) vídeo
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
    const bl = document.createElement('canvas'); bl.width = 64; bl.height = 36; const bg = bl.getContext('2d');
    const F = (px, w = 700, fam = 'Geist') => `${w} ${px}px ${fam}, 'Segoe UI', sans-serif`;
    const vids = segs.map(() => null); let vAtual = -1, v = null;
    const abrir = async i => { if (vAtual === i) return; if (v) { v.removeAttribute('src'); v.load(); } v = document.createElement('video'); v.muted = true; v.preload = 'auto'; v.src = segs[i].url; await new Promise((r, j) => { v.onloadedmetadata = r; v.onerror = () => j(new Error('video ' + i)); }); vAtual = i; };
    const alvo = async tt => { v.currentTime = Math.min(tt, v.duration - 0.05); await new Promise(r => { v.onseeked = r; }); };
    function intro(tt) {
      g.fillStyle = '#07070a'; g.fillRect(0, 0, W, H);
      const fl = 0.85 + 0.15 * Math.sin(tt * 37) * Math.sin(tt * 11), a = clamp(tt / 1.2) * clamp((INTRO - tt) / 0.6);
      const gr = g.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, 900); gr.addColorStop(0, `rgba(192,57,43,${0.30 * a * fl})`); gr.addColorStop(1, 'rgba(7,7,10,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
      g.textAlign = 'center'; g.fillStyle = `rgba(240,232,222,${a})`; g.font = F(210, 900); g.letterSpacing = '-8px'; g.fillText('10 CONTOS', W / 2, 400);
      g.font = F(120, 900); g.fillStyle = `rgba(192,57,43,${a * fl})`; g.letterSpacing = '4px'; g.fillText('DE TERROR BRASILEIROS', W / 2, 560); g.letterSpacing = '0px';
      g.font = F(36, 700, 'monospace'); g.fillStyle = `rgba(210,200,190,${a * clamp((tt - 2) / 1.5)})`; g.fillText('LIVROS  ·  FOLCLORE  ·  HISTÓRIAS DE HOJE', W / 2, 650);
      for (let i = 0; i < N; i++) { const on = clamp((tt - 4.2 - i * 0.42) / 0.3), x = W / 2 + (i - (N - 1) / 2) * 120; g.beginPath(); g.arc(x, 800, 14, 0, 7); g.fillStyle = `rgba(192,57,43,${0.15 + 0.85 * on * a})`; g.fill(); }
      g.textAlign = 'left'; g.fillStyle = `rgba(0,0,0,${clamp(1 - tt / 0.5)})`; g.fillRect(0, 0, W, H);
    }
    function conto(i, tt) { // video já posicionado em v
      const s = segs[i]; bg.drawImage(v, 0, v.videoHeight * 0.3, v.videoWidth, v.videoWidth * 9 / 16, 0, 0, 64, 36); // borrado: faixa central do quadro, amostra pequena esticada
      g.save(); g.filter = 'none'; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.drawImage(bl, 0, 0, 64, 36, 0, 0, W, H);
      g.fillStyle = 'rgba(0,0,0,0.62)'; g.fillRect(0, 0, W, H); g.restore();
      const fw = H * v.videoWidth / v.videoHeight, fx = (W - fw) / 2; g.drawImage(v, fx, 0, fw, H);
      g.fillStyle = 'rgba(0,0,0,0.0)';
      const al = clamp(tt / 0.6) * clamp((3.4 - tt) / 0.6); // etiqueta de capítulo nos primeiros segundos
      g.textAlign = 'left'; g.fillStyle = `rgba(230,224,214,${0.9 * al})`; g.font = F(34, 700, 'monospace'); g.fillText(`CONTO ${i + 1} DE ${N}`, 70, 120);
      g.fillStyle = `rgba(192,57,43,${al})`; g.fillRect(70, 138, 56, 5); g.fillStyle = `rgba(210,200,190,${0.85 * al})`; g.font = F(26, 600, 'monospace'); g.fillText(s.tipo.toUpperCase(), 70, 186);
      g.fillStyle = 'rgba(192,57,43,0.9)'; g.fillRect(0, H - 5, W * (i + clamp(tt / s.dur)) / N, 5); // progresso da coletânea
    }
    function fade(tt, dur) { const a = Math.max(clamp(1 - tt / 0.35), clamp((tt - (dur - FADE)) / FADE)); if (a > 0) { g.fillStyle = `rgba(0,0,0,${a})`; g.fillRect(0, 0, W, H); } }
    async function quadro(T) {
      if (T < INTRO) { intro(T); return; }
      for (let i = 0; i < N; i++) { const s = segs[i]; if (T >= s.t0 && T < s.t0 + s.dur) { await abrir(i); await alvo(T - s.t0); conto(i, T - s.t0); fade(T - s.t0, s.dur); return; } }
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    }
    if (q.has('info')) { document.title = 'ready ' + DUR.toFixed(2); return; }
    if (!render) {
      const ts = (q.get('t') || '5').split(',').map(Number), sw = 480, sh = 270, cols = Math.min(4, ts.length), sheet = document.createElement('canvas'); sheet.width = sw * cols; sheet.height = sh * Math.ceil(ts.length / cols); const sg = sheet.getContext('2d');
      for (let n = 0; n < ts.length; n++) { await quadro(ts[n]); sg.drawImage(cv, (n % cols) * sw, Math.floor(n / cols) * sh, sw, sh); sg.fillStyle = '#fff'; sg.font = '14px monospace'; sg.fillText(mm(ts[n]), (n % cols) * sw + 6, Math.floor(n / cols) * sh + 16); }
      sheet.style.cssText = 'width:100%'; document.body.append(sheet); document.title = 'ready ' + DUR.toFixed(2); return;
    }
    const mux = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS }, audio: { codec: 'aac', numberOfChannels: 2, sampleRate: SR }, fastStart: 'in-memory' });
    let err = null; const ve = new VideoEncoder({ output: (c, m) => mux.addVideoChunk(c, m), error: e => { err = e; } });
    let vcfg = null; for (const codec of ['avc1.640032', 'avc1.4d0032', 'avc1.42003e']) { const cf = { codec, width: W, height: H, framerate: FPS, bitrate: 7e6 }; if ((await VideoEncoder.isConfigSupported(cf)).supported) { vcfg = cf; break; } } if (!vcfg) throw new Error('sem H.264'); ve.configure(vcfg); window.MOTOR_INFO.codec = vcfg.codec;
    const ae = new AudioEncoder({ output: (c, m) => mux.addAudioChunk(c, m), error: e => err = e }); ae.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 160000 });
    for (let i = 0; i < len; i += 1024) { const n = Math.min(1024, len - i), d = new Float32Array(n * 2); d.set(AL.subarray(i, i + n), 0); d.set(AR.subarray(i, i + n), n); const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i * 1e6 / SR), data: d }); ae.encode(ad); ad.close(); if (ae.encodeQueueSize > 50) await sleep(2); }

    for (let fr = 0; fr < total; fr++) { await quadro(fr / FPS); const vf = new VideoFrame(cv, { timestamp: Math.round(fr * 1e6 / FPS) }); ve.encode(vf, { keyFrame: fr % 60 === 0 }); vf.close();

    await ve.flush(); await ae.flush(); if (err) throw err; mux.finalize();
    await fetch('/save?dir=contos-dia8&name=10_contos_de_terror_brasileiros.mp4', { method: 'POST', body: mux.target.buffer });
    document.title = 'ready ' + DUR.toFixed(2);
  } catch (e) { console.error(e); document.title = 'erro: ' + e.message; document.body.append(Object.assign(document.createElement('pre'), { textContent: 'ERRO: ' + e.message })); }
})();
