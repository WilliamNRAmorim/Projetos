<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>contos</title>
<script src="../brand.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>document.write(`<link rel="stylesheet" href="${BRAND.fontsCSS}"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=block">`)</script>
<style>body{margin:0;background:#222;padding:16px;color:#eee;font:14px monospace}</style></head><body>
<script src="sfx.js"></script>
<script src="sfx_contos.js"></script>
<script src="voz_fx.js"></script>
<script src="motor.js"></script>
<script src="motor_fx.js"></script>
<script src="contos.js"></script>
<script src="contos2.js"></script>
<script src="contos3.js"></script>
<script src="contos4.js"></script>
<script src="contos5.js"></script>
<script src="contos6.js"></script>
<script src="contos7.js"></script>
<script>
// Contos de terror (mesmo motor da série). ?ep=c01 (ep/indice.json) · &t=2 ou &t=1,5,9 (quadros) · &render=1 (MP4 em Semanal/contos-dia1) · &mix=1 (mede o áudio) · &voz=1 (vozes nos quadros)
(async () => {
  const q = new URLSearchParams(location.search), id = q.get('ep') || 'c01';
  try {
    const idx = await (await fetch('ep/indice.json')).json(), nome = idx[id];
    if (!nome) throw new Error(`episódio ${id} não está em ep/indice.json`);
    await Motor.run({ ep: await (await fetch(`ep/${nome}`)).json(), id, voz: `../stems/serie/ep${id}`, assets: 'assets' });
  } catch (e) { console.error(e); document.title = 'erro: ' + e.message; document.body.append(Object.assign(document.createElement('pre'), { textContent: 'ERRO: ' + e.message })); }
})();
</script></body></html>
