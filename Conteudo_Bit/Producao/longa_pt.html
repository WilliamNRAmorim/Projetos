<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>GMS longa PT</title>
<script src="brand.js"></script><script>document.write(`<link href="${BRAND.fontsCSS}" rel="stylesheet">`)</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>
body{margin:0;background:#05080f;color:#9aa;font:13px sans-serif}
#wrap{display:grid;gap:6px;padding:6px}
figure{margin:0}canvas{width:100%;display:block;background:#000}figcaption{padding:2px 4px}
</style></head><body><div id="wrap"></div>
<script>
// GMS — versão longa PT-BR, 1080x1920, 30 fps, 78 s.
// Gancho: falta de visibilidade → problema → virada → construção → o que cada tela faz → painel de gestão → prova → fecho.
// Cenas do filme original rodam no relógio da trilha (src); a montagem desloca em múltiplos de 8 s (1 ciclo de acordes).
const W = 1080, H = 1920, FPS = 30, DUR = 78, POSTER_T = 2.6;
const C = { bg0: BRAND.ink, bg1: BRAND.ink2, info: '#222225', light: BRAND.paper, red: BRAND.accent, ok: '#16A34A', rot: BRAND.mute, soft: BRAND.mute }; // sistema visual do canal (brand.js); cores das etapas = cores reais do app
const ST = ['#3B82F6', '#06B6D4', '#6366F1', '#8B5CF6', '#F59E0B', '#EF4444', '#F97316', '#10B981'];
const STN = ['Mandril', 'Tubo', 'Trançagem', 'Cobertura', 'Bandagem', 'Vulcanização', 'Debandagem', 'Extr./Teste'];
let ctx;

// ---------- helpers ----------
const EC = {}; const E = n => EC[n] || (EC[n] = gsap.parseEase(n));
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const P = (t, a, d) => cl((t - a) / d);
const tw = (t, a, d, e = 'power3.out') => E(e)(P(t, a, d));
const lerp = (a, b, p) => a + (b - a) * p;
const D2R = Math.PI / 180;
const br = n => n.toLocaleString('pt-BR');
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const font = (s, w) => `${Math.max(w, 700)} ${s}px "Geist"`;
function measure(s, size, w, track = 0) { ctx.save(); ctx.font = font(size, w); ctx.letterSpacing = (track * size) + 'px'; const m = ctx.measureText(s).width; ctx.restore(); return m; }
function T(s, x, y, o = {}) {
  const { size = 72, w = 700, color = C.light, align = 'left', alpha = 1, track = (w >= 800 ? -0.03 : -0.01), maxW = 0 } = o;
  if (alpha <= 0.001) return size;
  ctx.save(); ctx.globalAlpha *= alpha; let sz = size;
  if (maxW) { const m = measure(s, size, w, track); if (m > maxW) sz = size * maxW / m; }
  ctx.font = font(sz, w); ctx.letterSpacing = (track * sz) + 'px';
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); ctx.restore(); return sz;
}
function R(s, x, y, t, a, o = {}, dist = 40) {
  const p = tw(t, a, 0.6, 'expo.out'), al = tw(t, a, 0.28, 'power2.out');
  if (al <= 0) return; ctx.save(); ctx.translate(0, (1 - p) * dist); T(s, x, y, { ...o, alpha: (o.alpha ?? 1) * al }); ctx.restore();
}
function bg(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function rr(x, y, w, h, r, fill, stroke, lw = 2) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function circ(x, y, r, fill) { if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function check(x, y, s, color, lw) { ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw || s * 0.18; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x - s * 0.45, y); ctx.lineTo(x - s * 0.12, y + s * 0.33); ctx.lineTo(x + s * 0.5, y - s * 0.35); ctx.stroke(); ctx.restore(); }
function shadow(fn, blur = 40, oy = 16, col = 'rgba(0,0,0,.35)') { ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; fn(); ctx.restore(); }
function tap(x, y, t, a) {
  const p = P(t, a, 0.45); if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - p; ctx.strokeStyle = C.bg0; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x, y, 24 + 56 * E('power2.out')(p), 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(15,23,42,.28)'; ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.fill(); ctx.restore();
}
function ring(cx, cy, r, prog = 1, { dot = true, lw = r * 18 / 82, alpha = 1 } = {}) {
  if (alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.lineCap = 'round'; ctx.lineWidth = lw;
  for (let k = 0; k < 8; k++) { const f = cl(prog * 8 - k); if (f <= 0) continue; const a0 = (-86 + 45 * k) * D2R; ctx.strokeStyle = ST[k]; ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + 37 * D2R * f); ctx.stroke(); }
  if (dot) circ(cx, cy - r, r * 11.2 / 82, C.red);
  ctx.restore();
}
function mark(t, a, col) { const al = tw(t, a, 0.4, 'power2.out'); if (al <= 0) return; ring(116, 268, 24, 1, { alpha: al }); T('GMS', 156, 284, { size: 40, w: 800, color: col, alpha: al, track: 0.017 }); }

// ---------- 0–4 gancho: ninguém via ----------
function sA(t) {
  const shock = P(t, 1.9, 0.6);
  bg(C.bg0);
  if (t >= 1.9) { ctx.save(); ctx.globalAlpha = 0.9 * (1 - shock * 0.6); ctx.fillStyle = '#2A1620'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  T('Ninguém sabia o que', 90, 440, { size: 80, w: 800, maxW: 900 });
  T('acontecia na produção.', 90, 535, { size: 80, w: 800, maxW: 900 });
  const sx = t >= 1.9 ? Math.sin(t * 90) * 8 * (1 - shock) : 0;
  ctx.save(); ctx.translate(sx, 0);
  for (let i = 0; i < 8; i++) {
    const col = i % 2, row = Math.floor(i / 2), x = 90 + col * 460, y = 640 + row * 150;
    const a = 0.08 + i * 0.1, p = E('back.out(1.8)')(P(t, a, 0.35)); if (t < a) continue;
    ctx.save(); ctx.globalAlpha = P(t, a, 0.1); ctx.translate(x + 220, y + 65); ctx.scale(lerp(0.85, 1, p), lerp(0.85, 1, p)); ctx.translate(-220, -65);
    rr(0, 0, 440, 130, 24, C.bg1, 'rgba(148,163,184,.25)', 2);
    rr(0, 0, 12, 130, [24, 0, 0, 24], '#334155');
    T(STN[i], 40, 58, { size: 38, w: 700, color: C.rot, maxW: 300 });
    T('sem informação', 40, 104, { size: 28, w: 600, color: C.soft });
    circ(390, 65, 30, '#334155'); T('?', 390, 80, { size: 42, w: 800, color: C.rot, align: 'center' });
    ctx.restore();
  }
  ctx.restore();
  if (t >= 1.9) {
    const p = E('back.out(2.2)')(P(t, 1.9, 0.35));
    ctx.save(); ctx.translate(540, 1330); ctx.scale(lerp(0.7, 1, p), lerp(0.7, 1, p));
    T('Só descobria', 0, 0, { size: 96, w: 800, align: 'center', alpha: P(t, 1.9, 0.1) });
    T('no dia seguinte.', 0, 108, { size: 96, w: 800, align: 'center', alpha: P(t, 1.9, 0.1) }); ctx.restore();
  }
}

// ---------- 4–12 o problema: papel e dados espalhados ----------
const paper = (() => { const r = rng(7), a = []; for (let i = 0; i < 22; i++) a.push({ x: r() * 1300 - 110, y: r() * 2200 - 140, rot: (r() - .5) * 0.5, s: 0.9 + r() * 0.3, seed: i }); return a; })();
function drawSheet(sh, t) {
  ctx.save(); ctx.translate(sh.x, sh.y + Math.sin(t * 0.8 + sh.seed) * 6); ctx.rotate(sh.rot); ctx.scale(sh.s, sh.s);
  const w = 560, h = 760;
  shadow(() => rr(-w / 2, -h / 2, w, h, 6, '#E9EDF2'), 30, 10, 'rgba(0,0,0,.45)');
  ctx.strokeStyle = 'rgba(100,116,139,.35)'; ctx.lineWidth = 2;
  for (let y = -h / 2 + 90; y < h / 2 - 40; y += 52) { ctx.beginPath(); ctx.moveTo(-w / 2 + 30, y); ctx.lineTo(w / 2 - 30, y); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(-w / 2 + 190, -h / 2 + 90); ctx.lineTo(-w / 2 + 190, h / 2 - 40); ctx.stroke();
  ctx.fillStyle = 'rgba(15,23,42,.7)'; ctx.fillRect(-w / 2 + 30, -h / 2 + 32, 220, 24);
  ctx.strokeStyle = 'rgba(30,58,138,.75)'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  const r = rng(100 + sh.seed);
  for (let row = 0; row < 11; row++) {
    const y = -h / 2 + 90 + row * 52 + 34; if (r() < 0.25) continue;
    let x = -w / 2 + 40; const end = x + 130 + r() * (w - 260);
    ctx.beginPath(); ctx.moveTo(x, y);
    while (x < end) { const nx = x + 14 + r() * 16; ctx.quadraticCurveTo((x + nx) / 2, y - 10 - r() * 12, nx, y + (r() - .5) * 6); x = nx; }
    ctx.stroke();
    if (r() < 0.22) { ctx.save(); ctx.strokeStyle = 'rgba(220,38,38,.6)'; ctx.beginPath(); ctx.moveTo(-w / 2 + 40, y - 8); ctx.lineTo(end, y - 12); ctx.stroke(); ctx.restore(); }
  }
  ctx.restore();
}
const SOURCES = [['papel', 140, 860, -4], ['planilhas soltas', 470, 960, 3], ['quadro branco', 170, 1080, 2], ['a memória das pessoas', 300, 1190, -2]];
function sP(t) {
  bg(C.bg0);
  ctx.save(); const z = 1 + 0.04 * P(t, 4, 8); ctx.translate(540, 960); ctx.scale(z, z); ctx.translate(-540, -960);
  for (const sh of paper) drawSheet(sh, t); ctx.restore();
  const g = ctx.createRadialGradient(540, 920, 80, 540, 920, 1250); g.addColorStop(0, 'rgba(15,23,42,.62)'); g.addColorStop(1, 'rgba(15,23,42,.9)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(15,23,42,${0.3 * P(t, 7.6, 0.4)})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 36;
  const o1 = 1 - P(t, 7.5, 0.25);
  if (o1 > 0) {
    ctx.save(); ctx.globalAlpha = o1;
    T('Centenas', 540, 860, { size: 210, w: 800, align: 'center', track: -0.02, alpha: P(t, 4.3, 0.15) });
    R('de fichas de papel por mês.', 540, 985, t, 4.5, { size: 72, w: 800, align: 'center', maxW: 900 });
    R('Tudo escrito à mão', 540, 1100, t, 5.4, { size: 56, w: 600, align: 'center' });
    R('e digitado de novo depois.', 540, 1175, t, 5.7, { size: 56, w: 600, align: 'center', color: C.rot });
    ctx.restore();
  }
  R('Os dados ficavam', 90, 620, t, 7.8, { size: 72, w: 800 });
  R('espalhados por todo lado:', 90, 710, t, 7.95, { size: 72, w: 800, maxW: 900 });
  SOURCES.forEach(([s, x, y, rot], i) => {
    const a = 8.0 + i * 0.33, p = E('back.out(2.2)')(P(t, a, 0.35)); if (t < a) return;
    const w = measure(s, 44, 700) + 64;
    ctx.save(); ctx.globalAlpha = P(t, a, 0.1); ctx.translate(x + w / 2, y); ctx.rotate(rot * D2R); ctx.scale(lerp(0.6, 1, p), lerp(0.6, 1, p));
    rr(-w / 2, -44, w, 88, 44, C.bg1, C.rot, 2); T(s, 0, 15, { size: 44, w: 700, align: 'center' }); ctx.restore();
  });
  R('Nenhum número batia.', 90, 1420, t, 10.1, { size: 84, w: 800, maxW: 900 });
  if (t >= 10.3) { ctx.fillStyle = '#EF4444'; ctx.fillRect(90, 1448, 860 * E('power3.out')(P(t, 10.3, 0.4)), 8); }
  ctx.restore();
}

// ---------- 12–18 a virada: a linha atravessa as 8 etapas ----------
function sV(t) {
  bg(C.info);
  R('Então eu criei um sistema', 90, 420, t, 12.3, { size: 70, w: 800, maxW: 900 });
  R('que mostra a fábrica', 90, 510, t, 12.45, { size: 70, w: 800 });
  R('inteira, ao vivo: o GMS.', 90, 600, t, 12.6, { size: 70, w: 800, maxW: 900 });
  const x0 = 170, y0 = 720, ry = k => 790 + k * 92;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 12;
  for (let k = 0; k < 8; k++) {
    const a = 14.5 + k * 0.28, f = E('power2.out')(P(t, a - 0.25, 0.25)); if (f <= 0) continue;
    const ya = k ? ry(k - 1) : y0, yb = ry(k); ctx.strokeStyle = ST[k]; ctx.beginPath(); ctx.moveTo(x0, ya); ctx.lineTo(x0, lerp(ya, yb, f)); ctx.stroke();
  }
  ctx.restore();
  for (let k = 0; k < 8; k++) {
    const a = 14.5 + k * 0.28; if (t < a) continue;
    const p = E('back.out(2.5)')(P(t, a, 0.3)); circ(x0, ry(k), 18 * p, ST[k]);
    ctx.save(); ctx.translate((1 - E('expo.out')(P(t, a, 0.4))) * 40, 0); T(STN[k], 230, ry(k) + 17, { size: 48, w: 700, alpha: P(t, a, 0.12) }); ctx.restore();
  }
  circ(x0, y0, 20 * E('back.out(3)')(P(t, 13.5, 0.35)) * (1 + (t > 13.5 && t < 14.5 ? Math.exp(-((t - 13.5) % 0.5) * 8) * 0.3 : 0)), C.red);
  const sw = P(t, 13.5, 0.7); if (sw > 0 && sw < 1) { ctx.save(); ctx.globalAlpha = 1 - sw; ctx.strokeStyle = C.light; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x0, y0, 20 + sw * 160, 0, 7); ctx.stroke(); ctx.restore(); }
  R('8 etapas · 3 turnos · 1 fonte de dados', 90, 1545, t, 16.7, { size: 42, w: 700, maxW: 900 });
}

// ---------- construção: régua de 8 meses (relógio src 10–20) ----------
const MS = [[10.0, 1], [11.25, 2], [12.5, 3], [13.15, 4], [13.8, 5], [14.45, 6], [15.1, 7], [15.75, 8], [16.4, 9]]; // TCC: 9 meses = 2 de desenvolvimento + 7 de implantação
const RX0 = 90, RW = 900, RG = 10, CW = (RW - 8 * RG) / 9, RY = 1320, RING = { x: 540, y: 1360, r: 170 };
const cellX = i => RX0 + i * (CW + RG);
const PH = [{ n: 'DESENVOLVIMENTO', a: 10.0, i0: 0, i1: 1 }, { n: 'IMPLANTAÇÃO', a: 12.5, i0: 2, i1: 8 }];
const PC = [
  { a: 10.0, title: 'Desenvolvimento', lines: ['de manhã, observar a estação;', 'à tarde, programar.'] },
  { a: 12.5, title: 'Implantação', lines: ['nos 3 turnos, junto', 'com cada operador.'] },
  { a: 15.5, title: 'O mais difícil', chips: ['não foi a tecnologia', 'foi a adoção'], chipAt: [15.73, 16.23] },
  { a: 18.0, title: 'Hoje', typed: 'cada etapa, ao vivo.' },
];
function s3(t) {
  bg(C.bg1); mark(t, 10.2, C.light);
  R('COMO FOI CONSTRUÍDO', 90, 420, t, 10.25, { size: 32, w: 600, color: C.rot, track: 0.06 });
  let mi = 0; for (let i = 0; i < MS.length; i++) if (t >= MS[i][0]) mi = i;
  const [at, m] = MS[mi];
  T('MÊS', 90, 510, { size: 32, w: 600, color: C.rot, track: 0.06, alpha: P(t, 10.3, 0.3) });
  const pin = E('expo.out')(P(t, at, 0.45));
  if (mi > 0 && t - at < 0.25) { const q = P(t, at, 0.25); T(String(MS[mi - 1][1]), 90, 720 - q * 70, { size: 240, w: 800, alpha: 1 - q, track: -0.02 }); }
  T(String(m), 90, 720 + (1 - pin) * 70, { size: 240, w: 800, alpha: P(t, at, 0.15), track: -0.02 });
  T('de 9', 90 + measure(String(m), 240, 800, -0.02) + 28, 720, { size: 64, w: 700, color: C.rot, alpha: P(t, 10.3, 0.3) });
  let pi = 0; for (let i = 0; i < PC.length; i++) if (t >= PC[i].a) pi = i;
  const ph = PC[pi], next = PC[pi + 1], out = next ? P(t, next.a - 0.15, 0.15) : 0, A = ph.a + 0.05;
  ctx.save(); ctx.globalAlpha = 1 - out;
  R(ph.title, 90, 900, t, A, { size: 96, w: 800 });
  if (ph.lines) ph.lines.forEach((s, i) => R(s, 90, 990 + i * 62, t, A + 0.1 + i * 0.08, { size: 46, w: 600 }));
  if (ph.chips) ph.chips.forEach((s, i) => {
    const p = E('back.out(2)')(P(t, ph.chipAt[i], 0.35)); if (p <= 0) return;
    ctx.save(); ctx.globalAlpha *= P(t, ph.chipAt[i], 0.12); ctx.translate(90, 950 + i * 96); ctx.scale(lerp(0.85, 1, p), lerp(0.85, 1, p));
    const w = measure(s, 40, 700) + 110; rr(0, 0, w, 78, 39, C.bg0, C.ok, 3); check(42, 39, 30, C.ok, 6); T(s, 76, 53, { size: 40, w: 700, color: C.ok }); ctx.restore();
  });
  if (ph.typed) {
    let k = 0; for (let j = 0; j < 18; j++) if (t >= 18.3 + j * 0.075) k++;
    const n = Math.ceil(k / 18 * ph.typed.length), s = ph.typed.slice(0, n); T(s, 90, 1000, { size: 56, w: 700 });
    if (Math.floor(t * 2.5) % 2 === 0 || k < 18) { const x = 90 + measure(s, 56, 700) + 6; ctx.fillStyle = C.ok; ctx.fillRect(x, 950, 5, 62); }
  }
  ctx.restore();
  const mp = E('power3.inOut')(P(t, 18.0, 0.9)), fade = 1 - P(t, 17.9, 0.3);
  for (let i = 0; i < 9; i++) { ctx.save(); ctx.globalAlpha = fade; rr(cellX(i), RY - 13, CW, 26, 13, 'rgba(148,163,184,.16)'); ctx.restore(); }
  let tip = null;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 26;
  for (let i = 0; i < 9; i++) {
    if (t < MS[i][0]) break;
    const f = Math.max(0.001, E('power2.out')(P(t, MS[i][0], 0.35)));
    ctx.strokeStyle = [...ST, '#E2231A'][i]; ctx.beginPath();
    for (let s = 0; s <= 16; s++) {
      const u = s / 16 * f, lx = cellX(i) + 13 + (CW - 26) * u, ly = RY;
      const ang = (-90 + 40 * i + 3.6 + 32.8 * u) * D2R, rx = RING.x + Math.cos(ang) * RING.r, ry = RING.y + Math.sin(ang) * RING.r;
      const x = lerp(lx, rx, mp), y = lerp(ly, ry, mp); s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); if (s === 16) tip = [x, y];
    }
    ctx.stroke();
  }
  ctx.restore();
  if (tip && mp < 0.5) circ(tip[0] + 22 * (1 - mp * 2), tip[1], 16 * (1 - mp * 2), C.red);
  if (mp > 0.95) circ(RING.x, RING.y - RING.r, 18 * E('back.out(3)')(P(t, 18.85, 0.3)), C.red);
  for (let i = 0; i < 9; i++) T(String(i + 1), cellX(i) + CW / 2, RY + 62, { size: 28, w: 700, align: 'center', color: t >= MS[i][0] ? C.light : C.rot, alpha: fade });
  PH.forEach((p, idx) => {
    const al = tw(t, p.a, 0.3, 'power2.out') * fade; if (al <= 0) return;
    const x0 = cellX(p.i0), x1 = cellX(p.i1) + CW, y = RY + 100, active = t < (PH[idx + 1]?.a ?? 18);
    ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = active ? C.light : C.rot; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x0 + 4, y - 14); ctx.lineTo(x0 + 4, y); ctx.lineTo(x1 - 4, y); ctx.lineTo(x1 - 4, y - 14); ctx.stroke(); ctx.restore();
    T(p.n, p.i0 === 0 ? x0 + 4 : (x0 + x1) / 2, y + 48, { size: 30, w: 700, track: 0.06, align: p.i0 === 0 ? 'left' : 'center', color: active ? C.light : C.rot, alpha: al });
  });
}

// ---------- tela 1: apontamento na fonte (src 20–26) ----------
function s4(t) {
  bg(C.info); mark(t, 20.2, C.light);
  R('O operador cola a ordem', 90, 420, t, 20.28, { size: 70, w: 800, maxW: 900 });
  R('e escolhe o carretel.', 90, 506, t, 20.38, { size: 70, w: 800 });
  const up = E('expo.out')(P(t, 20.55, 0.7)), oy = lerp(260, 0, up);
  const X = 90, Y = 590, Wc = 900, Hc = 800;
  ctx.save(); ctx.translate(0, oy); ctx.globalAlpha = P(t, 20.55, 0.2);
  shadow(() => rr(X, Y, Wc, Hc, 36, C.light), 60, 24, 'rgba(15,23,42,.45)');
  circ(X + 60, Y + 72, 14, ST[2]); T('Trançagem · ficha de produção', X + 90, Y + 86, { size: 38, w: 700, color: C.bg0, maxW: 620 });
  T('Turno 2', X + Wc - 50, Y + 86, { size: 32, w: 600, color: C.bg1, align: 'right' });
  ctx.fillStyle = 'rgba(148,163,184,.5)'; ctx.fillRect(X + 40, Y + 130, Wc - 80, 2);
  let n = 0; for (let j = 0; j < 8; j++) if (t >= 21.4 + j * 0.09) n++;
  const typing = t >= 21.25 && t < 22.25, op = '40218837'.slice(0, n);
  T('ORDEM (OP)', X + 50, Y + 195, { size: 28, w: 700, color: C.bg1, track: 0.05 });

// ---------- fecho (src 52–62) ----------

function place(dst, src, s0, d0, dur, gain = 1) {
