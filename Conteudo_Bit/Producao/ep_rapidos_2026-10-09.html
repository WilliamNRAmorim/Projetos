<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>rapidos 09-10</title>
<script src="brand.js"></script><script src="bit_art.js"></script><script src="ep_kit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>document.write(`<link rel="stylesheet" href="${BRAND.fontsCSS}">`)</script>
<style>body{margin:0;background:#222;padding:16px}canvas{width:360px}</style></head><body>
<script>
// Fatos rápidos de sexta 09/10, SEM narração (só legenda grande + trilha). ?v=bug | ?v=maq ; ?sheet=1 confere ; ?save=1 renderiza.
// Artes do Bit e objetos geradas no Gemini (Nano Banana) e recortadas por BitArt.cutout; texto, layout e dados em código.
// Fontes (bug): Smithsonian/NMAH e Computer History Museum (mariposa no relé #70 do Harvard Mark II, 9/9/1947); carta de Edison de 1878 usando "bug" (Oxford English Dictionary / Nat Geo).
const { W, H, clamp, out, txt, glitch } = EpKit;
const P = BRAND.paper, A = BRAND.accent, MU = BRAND.mute, I2 = BRAND.ink2, OK = '#3DDC97';
const q = new URLSearchParams(location.search), V = q.get('v') || 'bug';
const ART = {};
const obj = (g, im, cx, cy, h) => { const w = im.width * h / im.height; g.drawImage(im, cx - w / 2, cy - h / 2, w, h); };
const bitDraw = (g, k, cx, bottom, h) => BitArt.draw(g, ART[k], cx, bottom, h);
const rot = (g, s, y = 230, col = A) => txt(g, s, 90, y, 30, col, { mono: true, w: 700 });
const EP = {
  bug: {
    out: 'Sex09_B_TikTok_Instagram_PrimeiroBug.mp4', art: ['bit_lupa', 'bit_pinca', 'obj_mariposa', 'obj_rele', 'obj_caderno'],
    falas: [
      { cena: 'gancho', acc: ['inseto', 'verdade.'], txt: 'O primeiro bug da história dos computadores foi um inseto de verdade.' },
      { cena: 'rele', acc: ['mariposa'], txt: '1947, Harvard. O computador parou. Dentro de um relé: uma mariposa.' },
      { cena: 'caderno', acc: ['bug'], txt: 'Colaram ela no caderno: "primeiro caso real de bug encontrado".' },
      { cena: 'edison', acc: ['1878.'], txt: 'Só que a palavra "bug" já existia. Edison usava em 1878 pra falar de defeito.' },
      { cena: 'fim', acc: ['piada.'], txt: 'A mariposa não inventou o bug. Só deu a piada que a gente repete até hoje.' },
    ],
    cenas: {
      gancho(g, u, k, fr) { rot(g, 'O MITO'); glitch(g, (dx, dy, c) => txt(g, 'BUG', 90 + dx, 640, 330, c || P), clamp(1 - u / 0.5) * 0.6, fr);
        bitDraw(g, 'bit_lupa', 560, 1230, 620); obj(g, ART.obj_mariposa, 880 + Math.sin(u * 3) * 20, 760 + Math.sin(u * 4) * 20, 200); },
      rele(g, u, k) { rot(g, '09.09.1947 · HARVARD MARK II'); obj(g, ART.obj_rele, W / 2, 700, 600);
        if (k > 0.35) { const a = out(clamp((k - 0.35) / 0.25)); obj(g, ART.obj_mariposa, W / 2 - 20, 720, 190 * a + 1); }
        txt(g, 'RELÉ #70', 90, 1090, 70, A, { mono: true, w: 700 }); },
      caderno(g, u, k) { rot(g, 'O CADERNO DE REGISTRO'); obj(g, ART.obj_caderno, W / 2, 620, 560);
        const a = out(clamp(k / 0.3)); obj(g, ART.obj_mariposa, W / 2 - 10, 610 + (1 - a) * -200, 130 * a + 1);
        const b = clamp((k - 0.35) / 0.2), sc = 1 + (1 - out(b)) * 0.4; g.save(); g.translate(W / 2, 1060); g.rotate(-0.04); g.scale(sc, sc); g.globalAlpha = b;
        txt(g, '"First actual case of', 0, 0, 52, A, { align: 'center', w: 800 }); txt(g, 'bug being found."', 0, 66, 52, A, { align: 'center', w: 800 }); g.restore(); },
      edison(g, u, k, fr) { rot(g, 'MAS ANTES DISSO');
        glitch(g, (dx, dy, c) => txt(g, '1878', 90 + dx, 800, 330, c || A), clamp(1 - u / 0.5) * 0.6, fr);
        g.fillStyle = I2; g.fillRect(90, 900, W - 180, 260); g.strokeStyle = '#2A2A2E'; g.lineWidth = 2; g.strokeRect(90, 900, W - 180, 260);
        txt(g, 'CARTA DE THOMAS EDISON', 130, 990, 34, MU, { mono: true, w: 700 }); txt(g, '"bug" = defeito', 130, 1100, 80, P); },
      fim(g, u) { obj(g, ART.obj_mariposa, 300, 700, 360 + Math.sin(u * 8) * 10); bitDraw(g, 'bit_pinca', 760, 1230, 620); rot(g, 'A PIADA FICOU'); },
    },
    musica: () => 0.13,
  },
  maq: {
    out: 'Sex09_C_TikTok_FuncionaNaMinhaMaquina.mp4', art: ['bit_dev_orgulhoso', 'bit_dev_alibi', 'bit_entregando', 'obj_notebook_fogo', 'obj_caixa_container'],
    falas: [
      { cena: 'dev', acc: ['funciona.'], txt: 'Dev: "na minha máquina funciona."' },
      { cena: 'cliente', acc: ['erro.'], txt: 'Cliente: "aqui deu erro."' },
      { cena: 'solucao', acc: ['máquina'], txt: 'Solução óbvia: entregar a minha máquina pro cliente.' },
      { cena: 'docker', acc: ['Docker'], txt: 'E é basicamente isso que o Docker faz: manda o ambiente inteiro dentro de uma caixa.' },
      { cena: 'fim', acc: ['álibi.'], txt: '"Funciona na minha máquina" é só um bug com álibi.' },
    ],
    cenas: {
      dev(g, u, k) { rot(g, 'DEV · 17:58 DE SEXTA'); txt(g, '$ npm start', 90, 460, 70, MU, { mono: true, w: 500 }); const a = clamp((k - 0.3) / 0.15); g.globalAlpha = a; txt(g, '✓ funcionando', 90, 590, 90, OK, { mono: true, w: 700 }); g.globalAlpha = 1;
        bitDraw(g, 'bit_dev_orgulhoso', 560, 1230, 620); },
      cliente(g, u, k, fr) { rot(g, 'CLIENTE · MESMO CÓDIGO', 230, A); txt(g, '$ npm start', 90, 460, 70, MU, { mono: true, w: 500 }); glitch(g, (dx, dy, c) => txt(g, '✗ ERRO', 90 + dx, 640, 190, c || A, { mono: true, w: 700 }), clamp(1 - u / 0.5) * 0.7, fr);
        obj(g, ART.obj_notebook_fogo, W / 2, 1000, 520); },
      solucao(g, u, k) { rot(g, 'A SOLUÇÃO'); const t = out(clamp(k / 0.8)); bitDraw(g, 'bit_entregando', 330 + 360 * t, 1230, 620); txt(g, '→ cliente', 930, 520, 50, A, { align: 'right', mono: true, w: 700 }); },
      docker(g, u, k) { rot(g, 'DOCKER · CONTAINER'); obj(g, ART.obj_caixa_container, W / 2, 640, 520);
        ['código', 'bibliotecas', 'versões', 'sistema'].forEach((s, i) => { const a = clamp((k - 0.1 - i * 0.15) / 0.12); g.globalAlpha = a; g.fillStyle = I2; g.fillRect(150, 960 + i * 90, W - 300, 70); txt(g, s, 190, 1010 + i * 90, 40, P, { mono: true, w: 700 }); g.globalAlpha = 1; }); },
      fim(g, u) { glitch(g, (dx, dy, c) => txt(g, 'BUG', 90 + dx, 560, 300, c || P), 0.15, Math.round(u * 6)); txt(g, 'com álibi', 90, 660, 90, A); bitDraw(g, 'bit_dev_alibi', 600, 1230, 620); },
    },
    musica: () => 0.13,
  },
}[V];
EpKit.run({
  falas: EP.falas, cenas: EP.cenas, semVoz: true, gap: 0.3, tail: 0.8, grao: 0.03, bitrate: 1.8e6, cbr: true, abitrate: 96000,
  dir: 'semana-2026-10-05', out: EP.out, musica: EP.musica,
  prep: async () => { for (const k of EP.art) ART[k] = await BitArt.load(`/Marca/bit/${k}.png`); },
}).catch(e => document.title = 'ERROR ' + e.message);
</script></body></html>
