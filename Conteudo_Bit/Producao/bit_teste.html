<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Bit teste</title>
<script src="brand.js"></script><script>document.write(`<link href="${BRAND.fontsCSS}" rel="stylesheet">`)</script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="bit_rig.js"></script>
<style>body{margin:0;background:#000;display:flex;gap:8px;padding:8px;flex-wrap:wrap}canvas{width:340px}</style></head><body>
<script>
// Teste do boneco articulado: 4 s em loop (pisca, olha, acena, antena balança, anel do GMS gira na antena).
const W = 1080, H = 1350, FPS = 30, DUR = 4, B = BRAND, q = new URLSearchParams(location.search);
function scene(ctx, t) {
  ctx.fillStyle = B.ink; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(540, 720, 60, 540, 720, 640); g.addColorStop(0, 'rgba(255,59,31,.22)'); g.addColorStop(1, 'rgba(255,59,31,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const blink = [1.2, 3.1].reduce((m, b) => Math.max(m, 1 - Math.min(1, Math.abs(t - b) / 0.07)), 0);
  const mood = t > 2 && t < 3.6 ? 'feliz' : 'neutro', ring = Math.min(1, Math.max(0, (t - 0.3) / 0.8)) * (t < 3.7 ? 1 : 1 - (t - 3.7) / 0.3);
  BitRig.draw(ctx, t, { x: 540, y: 1180, s: 1.3, pose: 'tchau', ring, face: { blink, mood } });
  grain(ctx, W, H, 0.06);
}
async function render(cv, ctx) {
  const mux = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS }, fastStart: 'in-memory' });
  const ve = new VideoEncoder({ output: (c, m) => mux.addVideoChunk(c, m), error: e => document.title = 'ERR ' + e.message });
  ve.configure({ codec: 'avc1.640032', width: W, height: H, bitrate: 8e6, framerate: FPS });
  for (let f = 0; f < FPS * DUR; f++) { scene(ctx, f / FPS); const vf = new VideoFrame(cv, { timestamp: Math.round(f * 1e6 / FPS) }); ve.encode(vf, { keyFrame: f % 60 === 0 }); vf.close(); }
  await ve.flush(); mux.finalize(); await fetch('/save?dir=testes&name=bit_teste.mp4', { method: 'POST', body: mux.target.buffer });
}
(async () => {
  await loadBrandFonts(); await BitRig.load('/Marca/bit/bit_corpo.jpg');
  if (q.has('render')) { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.append(cv); await render(cv, cv.getContext('2d')); document.title = 'DONE'; return; }
  for (const t of (q.get('t') || '0.2,1.0,2.5').split(',').map(Number)) { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.append(cv); scene(cv.getContext('2d'), t); }
  document.title = 'ready';
})().catch(e => document.title = 'ERROR ' + e.message);
</script></body></html>
