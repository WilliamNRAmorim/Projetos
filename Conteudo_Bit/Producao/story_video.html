<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>story video</title>
<script src="brand.js"></script><script src="bit_art.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>document.write(`<link rel="stylesheet" href="${BRAND.fontsCSS}">`)</script>
<style>body{margin:0;background:#222;padding:16px}canvas{width:360px}</style></head><body>
<script>
// Story de chamada em vídeo (1080×1920): o próprio post rodando num quadro, com o Bit do projeto ao lado.
// ?s=qua|qui|sab escolhe o story; ?save=1 renderiza o mp4 e grava na pasta da semana; ?t=7 mostra só o quadro de 7 s.
const q = new URLSearchParams(location.search), W = 1080, H = 1920, FPS = 30, M = 96, DIR = 'semana-2026-10-05';
const STORIES = {
  // hook = só o gancho do post roda; depois o quadro congela com "continua no perfil" (story é teaser, não o post inteiro)
  // story agendado não tem link pro post: vai ao ar ANTES (12h) como "hoje às 19h"; às 19h o post é compartilhado no story pelo app (aí sim tocável)
  qua: { out: 'Qua07_Story_GMS.mp4', src: '/Videos/Publicar/GMS_Reel_PT_30s.mp4', dur: 6.5, hook: 3.5, cut: ['hoje', 'às 19h.'], dark: true, bit: 'bit_pensando', ring: true,
    label: 'HOJE 19H · GMS', head: [['A fábrica só via o\nturno no ', 'fg'], ['dia seguinte.', 'acc']], foot: 'REEL NOVO HOJE ÀS 19H' },
  sab: { out: 'Sab10_Story_Mario.mp4', src: `/Semanal/${DIR}/Sab10_Carrossel_5.mp4`, dur: 8, loop: 8, dark: true, bit: 'bit_feliz',
    label: 'HOJE 11H · GAMES', head: [['Quanto espaço o Super\nMario ocupava? ', 'fg'], ['?? KB', 'acc']], foot: 'A RESPOSTA SAI HOJE ÀS 11H' },
};
const C = STORIES[q.get('s') || 'qua'];
const col = k => k === 'acc' ? BRAND.accent : C.dark ? BRAND.paper : BRAND.ink;
function seek(v, t) { // quadro exato: espera o seeked e o quadro novo chegar no vídeo (com folga, pra não travar)
  return new Promise(res => { const done = () => { v.removeEventListener('seeked', on); res(); }; const on = () => v.requestVideoFrameCallback ? (v.requestVideoFrameCallback(done), setTimeout(done, 250)) : done(); v.addEventListener('seeked', on); v.currentTime = t; });
}
function frame(g, t, v, bit) {
  g.fillStyle = C.dark ? BRAND.ink : BRAND.paper; g.fillRect(0, 0, W, H);
  if (C.dark) { const gl = g.createRadialGradient(W * 0.75, H * 0.8, 40, W * 0.75, H * 0.8, W * 0.8); gl.addColorStop(0, 'rgba(255,59,31,.32)'); gl.addColorStop(1, 'rgba(255,59,31,0)'); g.fillStyle = gl; g.fillRect(0, 0, W, H); }
  g.textBaseline = 'alphabetic';
  g.font = '700 34px "Geist Mono"'; g.letterSpacing = '2px'; g.fillStyle = BRAND.accent; g.fillText(C.label, M, 300);
  g.font = '900 72px Geist'; g.letterSpacing = '-2.5px'; let x = M, y = 392;
  for (const [txt, k] of C.head) txt.split(/(\n)/).forEach(s => { if (s === '\n') { x = M; y += 80; return; } g.fillStyle = col(k); g.fillText(s, x, y); x += g.measureText(s).width; });
  // o post rodando num quadro com sombra seca vermelha
  const top = 520, maxH = 1100, maxW = 640, ar = v.videoWidth / v.videoHeight; let ch = maxH, cw = ch * ar; if (cw > maxW) { cw = maxW; ch = cw / ar; }
  g.fillStyle = BRAND.accent; g.fillRect(M + 16, top + 16, cw, ch); g.drawImage(v, M, top, cw, ch);
  if (C.hook && t > C.hook) { // corte: escurece o quadro e manda pro perfil
    const k = Math.min(1, (t - C.hook) / 0.3); g.fillStyle = `rgba(12,12,13,${0.72 * k})`; g.fillRect(M, top, cw, ch);
    g.globalAlpha = k; g.fillStyle = BRAND.paper; g.font = '900 76px Geist'; g.letterSpacing = '-2.5px'; g.textAlign = 'center';
    const [l1, l2] = C.cut || ['continua', 'no perfil.'];
    g.fillText(l1, M + cw / 2, top + ch / 2 - 10); g.fillStyle = BRAND.accent; g.fillText(l2, M + cw / 2, top + ch / 2 + 74); g.textAlign = 'left'; g.globalAlpha = 1;
  }
  g.lineWidth = 5; g.strokeStyle = C.dark ? BRAND.paper : BRAND.ink; g.strokeRect(M, top, cw, ch);
  BitArt.draw(g, bit, 870, 1700 + Math.sin(t * 2.2) * 10, 470, C.ring ? { ring: t * 0.9 } : {});
  g.font = '700 34px "Geist Mono"'; g.letterSpacing = '2px'; g.fillStyle = BRAND.mute; g.fillText(C.foot, M, 1730);
}
(async () => {
  await loadBrandFonts();
  const bit = await BitArt.load(`/Marca/bit/${C.bit}.png`);
  const v = document.createElement('video'); v.src = C.src; v.muted = true; v.playsInline = true; v.preload = 'auto';
  await new Promise((r, j) => { v.onloadeddata = r; v.onerror = () => j(new Error('vídeo não carregou')); });
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.append(cv); const g = cv.getContext('2d');
  const at = t => C.loop ? t % C.loop : C.hook ? Math.min(t, C.hook) : t;
  if (!q.has('save')) { const t = +(q.get('t') || 3); await seek(v, at(t)); frame(g, t, v, bit); document.title = 'ready'; return; }
  // áudio: o som do próprio post, com fade no fim
  const SR = 48000, len = SR * C.dur, src = await new OfflineAudioContext(2, SR, SR).decodeAudioData(await (await fetch(C.src)).arrayBuffer());
  const L = new Float32Array(len), R = new Float32Array(len), s0 = src.getChannelData(0), s1 = src.numberOfChannels > 1 ? src.getChannelData(1) : s0, k = src.sampleRate / SR;
  for (let i = 0; i < len; i++) { const tt = at(i / SR), j = Math.min(s0.length - 1, Math.floor(tt * SR * k)), fade = Math.min(1, (len - i) / (SR * 0.6), i / (SR * 0.05), C.hook ? Math.max(0, 1 - (i / SR - C.hook) / 0.8) : 1); L[i] = s0[j] * fade; R[i] = s1[j] * fade; }
  const mux = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS }, audio: { codec: 'aac', numberOfChannels: 2, sampleRate: SR }, fastStart: 'in-memory' });
  let err = null;
  const ve = new VideoEncoder({ output: (c, m) => mux.addVideoChunk(c, m), error: e => err = e }); ve.configure({ codec: 'avc1.640032', width: W, height: H, bitrate: 8e6, framerate: FPS });
  const ae = new AudioEncoder({ output: (c, m) => mux.addAudioChunk(c, m), error: e => err = e }); ae.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 160000 });
  for (let i = 0; i < len; i += 1024) { const n = Math.min(1024, len - i), d = new Float32Array(n * 2); d.set(L.subarray(i, i + n), 0); d.set(R.subarray(i, i + n), n); const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i * 1e6 / SR), data: d }); ae.encode(ad); ad.close(); }
  for (let f = 0; f < FPS * C.dur; f++) {
    const t = f / FPS; await seek(v, at(t) + 0.001); frame(g, t, v, bit);
    const vf = new VideoFrame(cv, { timestamp: Math.round(f * 1e6 / FPS) }); ve.encode(vf, { keyFrame: f % 60 === 0 }); vf.close();
    if (ve.encodeQueueSize > 10) await new Promise(r => setTimeout(r, 5)); document.title = `${f}/${FPS * C.dur}`;
  }
  await ve.flush(); await ae.flush(); if (err) throw err; mux.finalize();
  await fetch(`/save?dir=${DIR}&name=${C.out}`, { method: 'POST', body: mux.target.buffer });
  document.title = 'ready';
})().catch(e => document.title = 'ERROR ' + e.message);
</script></body></html>
