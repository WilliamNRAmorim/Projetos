// URL: ?t=4,17 (quadros) [&safe=1] [&crop=x,y,w,h&shot=nome] · ?sheet=frame|mp4 · ?oito=frame|mp4 · ?audit=1 · ?linha=1 · ?render=1

const CAP = [
  { id: 'I', rotulo: 'I. A PERGUNTA', a: 0, b: 14.4, fonte: 'cena', noite: true, entra: [0, 0.8], sai: [13.9, 14.4] },
  { id: 'II', rotulo: 'II. O TRABALHO', a: 14.4, b: 24.8, fonte: 'clipe', sy: 221 },
  { id: 'III', rotulo: 'III. O QUERER', a: 24.8, b: 31.6, fonte: 'clipe', sy: 241 },
  { id: 'IV', rotulo: 'IV. O PESO', a: 31.6, b: 42.2, fonte: 'clipe', sy: 246 },
  { id: 'V', rotulo: 'V. O SENTIDO', a: 42.2, b: 50.0, fonte: 'cena', noite: false, entra: [42.2, 42.9], sai: [49.35, 50.0] },

// Falas: a voz (stems/curta/<arq>.mp3) começa em `t` (início da voz medido no arquivo); a legenda vai do início ao fim MEDIDOS da voz

const FALAS = [

  { n: 3, cap: 'I', quem: 'você', arq: 'voce_I_3', t: 8.2, txt: 'Se você dá conta do trabalho... pra que a gente serve?' },
  { n: 4, cap: 'II', quem: 'bit', arq: 'bit_II_1', t: 15.4, txt: 'Eu faço as tarefas. Milhares, enquanto você dorme.' },
  { n: 5, cap: 'II', quem: 'bit', arq: 'bit_II_2', t: 19.0, txt: 'Mas eu não acordo querendo coisas. Não do jeito que você acorda.' },
  { n: 6, cap: 'III', quem: 'bit', arq: 'bit_III_1', t: 25.6, txt: 'Você quer construir alguma coisa. Ficar bom nisso. Voltar pra casa e ter alguém lá.' },
  { n: 7, cap: 'IV', quem: 'você', arq: 'voce_IV_1', t: 32.4, txt: 'Então o querer... é nosso.' },
  { n: 8, cap: 'IV', quem: 'bit', arq: 'bit_IV_2', t: 34.9, txt: 'Sempre foi. Eu só carrego o peso, pra você poder voltar a ela.' },
  { n: 9, cap: 'V', quem: 'você', arq: 'voce_V_1', t: 43.2, txt: 'Voltar a quê?' },
  { n: 10, cap: 'V', quem: 'bit', arq: 'bit_V_2', t: 45.1, txt: 'Às pessoas. Ao que só você faria.' },

const CARTAO = [
  { linhas: ['A máquina leva', 'o trabalho.'], cor: P, a: 50.6, b: 58.0 },
  { linhas: ['O motivo é', 'de gente.'], cor: ACC, a: 52.4, b: 58.0 },

const FADE_FALA = 0.1, MASCARA = 0.5; // a 1ª e a última quadro de cada legenda já mostram 1/3 (nada antes nem depois da voz)
const PISCA = [3.6, 8.3, 11.9, 44.0, 47.6], RESPIRO = 4.0; // piscadas (s) e período do respiro do Bit

// ---------- texto ----------
function fonte(g, f) { g.font = `${f.w} ${f.s}px ${f.mono ? '"Geist Mono"' : 'Geist'}`; g.letterSpacing = f.mono ? '0px' : `${(f.tr ?? -0.02) * f.s}px`; g.textBaseline = 'alphabetic'; g.textAlign = 'left'; }
const FF = { w: 700, s: FALA.s }, FN = { w: 500, s: NOME.s, mono: true }, FR = { w: 500, s: ROT.s, mono: true }, FC = { w: 800, s: 96, tr: -0.035 };

let LAY = null, CAIXAS = null; // CAIXAS: caixas de texto visíveis (auditoria)

  for (const f of FALAS) { fonte(g, FF); const linhas = quebra(g, f.txt, MAXW), b0 = FALA.b - (linhas.length - 1) * FALA.lh; L.falas.push({ linhas, b0, nomeB: b0 - NOME.acima }); }
  // cartão: dois blocos centrados; o 1º acima do centro da área segura, o 2º abaixo
  fonte(g, FC); const lh = 104, gap = 70, alt = 4 * lh - (lh - 0) + gap, y0 = 865 - alt / 2 + 70; let b = y0;
  CARTAO.forEach((c, k) => { const bl = []; c.linhas.forEach(() => { bl.push(b); b += lh; }); b += gap - lh + lh; L.cartao.push(bl); if (!k) b = bl.at(-1) + lh + gap; });

}
function rotulo(g, t) { const c = capDe(t); if (!c.rotulo) return; fonte(g, FR); g.fillStyle = MU; g.fillText(c.rotulo, ROT.x, ROT.b); caixa(g, 'rotulo', c.rotulo, ROT.x, ROT.b); }
function falas(g, t) {

}

      if (off >= hB) return; g.save(); g.beginPath(); g.rect(0, top, W, hB); g.clip(); g.fillText(s, x, b + off); g.restore(); if (u >= 1) caixa(g, 'cartao' + k, s, x, b); }); });

// ---------- cena pixel art (I: noite com estrelas; V: amanhecer) ----------
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), rgbHex = c => '#' + c.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const NOITE = ['#1C1211', '#221614', '#2A1A18', '#321F1C', '#3B2420', '#442A25', '#4D2F29', '#56352E'].map(hexRGB);
const AURORA = ['#5A2C29', '#7C3D36', '#A0544A', '#C46E5E', '#DE8E7B', '#EDB09F', '#F6D2C6', '#FBE8E1'].map(hexRGB);
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]].map(r => r.map(v => (v + 0.5) / 16));
const SOMBRA = '#0D0909', SOMBRA2 = '#130C0B';
const HOR = 138, gy = x => HOR + Math.round(Math.pow((x - 80) / 136, 2) * 18); // colina: topo perto do banco
const BANCO = { x0: 34, len: 100, S: 126 }; // assento (topo) na linha S
const HUMANO = [ // silhueta sentada, virada para a direita (para o Bit); a última linha (33) encosta no assento
  '........xxxxx', '......xxxxxxxx', '.....xxxxxxxxxx', '.....xxxxxxxxxx', '....xxxxxxxxxxx', '....xxxxxxxxxxxx', '....xxxxxxxxxxxx', '.....xxxxxxxxxxxx', '.....xxxxxxxxxx', '......xxxxxxxxx',
  '.......xxxxxxx', '........xxxxx', '........xxxxx', '.....xxxxxxxxxx', '...xxxxxxxxxxxxx', '..xxxxxxxxxxxxxxx', '..xxxxxxxxxxxxxxx', '..xxxxxxxxxxxxxxxx', '..xxxxxxxxxxxxxxxx', '..xxxxxxxxxxxxxxxxx',
  '..xxxxxxxxxxxxxxxxx', '..xxxxxxxxxxxx.xxxxx', '..xxxxxxxxxxxx..xxxxx', '..xxxxxxxxxxxx...xxxx', '..xxxxxxxxxxxx...xxxx', '..xxxxxxxxxxxx....xxxx', '..xxxxxxxxxxxx....xxxx', '..xxxxxxxxxxxx.....xxx',
  '..xxxxxxxxxxxxx....xxx', '..xxxxxxxxxxxxxx...xxx', '..xxxxxxxxxxxxxxxxxxxxxxx', '..xxxxxxxxxxxxxxxxxxxxxxxx', '..xxxxxxxxxxxxxxxxxxxxxxxx', '...xxxxxxxxxxxxxxxxxxxxxxx',
];
const ESTRELAS = Array.from({ length: 120 }, (_, i) => ({ x: Math.floor(rnd(i * 3 + 1) * AW), y: Math.floor(rnd(i * 3 + 2) * 118), p: 1.6 + 3.2 * rnd(i * 7 + 5), f: rnd(i * 11 + 9), forte: rnd(i * 13 + 4) > 0.82 }));
const JUNCOS = [[198, 9], [201, 12], [203, 7], [206, 11], [208, 8], [211, 13], [213, 9], [12, 6], [15, 9]];
let SC = null;
function cenaPixel(t, noite) {
  if (!SC) { SC = document.createElement('canvas'); SC.width = AW; SC.height = AH; }
  const s = SC.getContext('2d'), img = s.createImageData(AW, AH), d = img.data, p = noite ? 0 : clamp((t - 42.2) / 7.8);
  const sol = { x: 158, y: HOR + 9 - Math.round(7 * p), r: 9 }; // o sol sobe devagar atrás da colina
  for (let y = 0; y < AH; y++) for (let x = 0; x < AW; x++) {
    let v = y / HOR * 7; // faixa do céu (0 topo .. 7 horizonte)
    if (!noite) { const dd = Math.hypot(x - sol.x, (y - sol.y) * 1.3); v += Math.max(0, 1 - dd / 46) * 2.2 + p * 0.6; }
    v = clamp(v, 0, 7); const i0 = Math.floor(v), fr = v - i0, i = fr > BAYER[y & 3][x & 3] ? Math.min(7, i0 + 1) : i0;
    const c = noite ? NOITE[i] : AURORA[i], o = (y * AW + x) * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
  }
  s.putImageData(img, 0, 0);
  if (noite) for (const e of ESTRELAS) { if (e.y >= gy(e.x) - 3) continue; const b = 0.5 + 0.5 * Math.sin(2 * Math.PI * (t / e.p + e.f)); // cintila (função de t)
    s.fillStyle = e.forte && b > 0.35 ? '#F2B4A4' : b > 0.8 ? '#E59C8C' : b > 0.3 ? '#9C6257' : '#6A423B'; s.fillRect(e.x, e.y, 1, 1); }
  else { s.fillStyle = '#FFF3EC'; for (let y = -sol.r; y <= sol.r; y++) { const w = Math.round(Math.sqrt(sol.r * sol.r - y * y)); s.fillRect(sol.x - w, sol.y + y, 2 * w + 1, 1); } }
  // colina e juncos
  s.fillStyle = SOMBRA; for (let x = 0; x < AW; x++) s.fillRect(x, gy(x), 1, AH - gy(x));
  for (const [x, h] of JUNCOS) { s.fillRect(x, gy(x) - h, 1, h); s.fillRect(x, gy(x) - h - 1, 1, 1); s.fillRect(x - 1, gy(x) - h, 1, 2); }
  for (let k = 0; k < 9; k++) { const x = BANCO.x0 + 8 + k * 11 + (k % 3); s.fillRect(x, gy(x) - 2, 1, 2); } // tufos de grama

  const { x0, len, S } = BANCO; s.fillStyle = SOMBRA2;
  s.fillRect(x0, S - 17, len, 2); s.fillRect(x0 + 2, S - 11, len - 4, 2); s.fillRect(x0 + 2, S - 6, len - 4, 2);
  for (const x of [x0 + 1, x0 + len - 3]) s.fillRect(x, S - 19, 2, gy(x) - (S - 19));
  s.fillRect(x0 - 2, S, len + 4, 2);
  for (const x of [x0 + 5, x0 + len - 7]) s.fillRect(x, S + 2, 2, gy(x) - S - 2);
  // humano sentado (silhueta), canela e pé
  const hx = x0 + 4, hy = S - HUMANO.length; s.fillStyle = SOMBRA;

  const kx = hx + 22; s.fillRect(kx, S, 4, gy(kx) - S - 2); s.fillRect(kx, gy(kx) - 2, 7, 2);

// ---------- Bit (sprite único: curta_bit_sprite.js) ----------
const BIT = { cx: 478 }; let BITIMG = null; // BITIMG: { aberto, piscando } recortados; escala e âncora
async function prepBit() {
  const S = window.CURTA_BIT, im = new Image(); im.src = S.src; await im.decode();
  const w = im.naturalWidth, h = im.naturalHeight, c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(im, 0, 0); const D = g.getImageData(0, 0, w, h), d = D.data, fundo = new Uint8Array(w * h), pilha = [];

  for (let x = 0; x < w; x++) pilha.push(x, (h - 1) * w + x); for (let y = 0; y < h; y++) pilha.push(y * w, y * w + w - 1);
  while (pilha.length) { const i = pilha.pop(); if (fundo[i] || !branco(i)) continue; fundo[i] = 1; const x = i % w, y = (i / w) | 0; if (x > 0) pilha.push(i - 1); if (x < w - 1) pilha.push(i + 1); if (y > 0) pilha.push(i - w); if (y < h - 1) pilha.push(i + w); }

    if (pis) for (const [ex, ey, rx, ry] of S.olhos) { kg.fillStyle = S.corPalpebra; kg.beginPath(); kg.ellipse(ex - x0, ey - y0, rx + 3, ry + 3, 0, 0, 2 * Math.PI); kg.fill();
      kg.strokeStyle = S.corLinha; kg.lineWidth = 9; kg.beginPath(); kg.moveTo(ex - x0 - rx, ey - y0 + 6); kg.quadraticCurveTo(ex - x0, ey - y0 + ry * 0.55, ex - x0 + rx, ey - y0 + 6); kg.stroke(); }

    kg.imageSmoothingEnabled = true; kg.imageSmoothingQuality = 'high'; if (S.espelhar) { kg.translate(sw, 0); kg.scale(-1, 1); } kg.drawImage(src, 0, 0, sw, sh); kg.setTransform(1, 0, 0, 1, 0, 0);
    const D = kg.getImageData(0, 0, sw, sh), d = D.data, topo = sw * Math.round(0.2 * sh); // topo = região da antena (haste fina: limiar menor)
    for (let i = 3; i < d.length; i += 4) { const p = i >> 2; d[i] = d[i] >= (p < topo ? 12 : 45) ? 255 : 0;
      if (noite && d[i] && p < topo && d[i - 3] + d[i - 2] + d[i - 1] < 260) { d[i - 3] = 150; d[i - 2] = 84; d[i - 1] = 72; } } // à noite só a haste escura ganha um tom de luz (senão some no céu)
    kg.putImageData(D, 0, 0); return k; };

}
function bit(g, t, noite) { // parado: só respiro (o tronco sobe 1 pixel) e piscada
  const B = BITIMG, pisca = PISCA.some(p => t >= p && t < p + 0.13), src = (noite ? B.noite : B.dia)[pisca ? 1 : 0];

// ---------- clipes do original (II, III, IV) ----------
let VID = null; const SRC_ROWS = JAN * 478 / W; // 398,3 linhas do original na janela de 900 px
async function prepVideo() {
  VID = document.createElement('video'); VID.muted = true; VID.preload = 'auto'; VID.playsInline = true; VID.src = q.get('src') || '/clip/v.mp4';
  await new Promise((r, j) => { VID.onloadeddata = r; VID.onerror = () => j(new Error('o vídeo original não carregou (sirva-o com Range e passe ?src=)')); });
}
async function busca(v, ts) { if (Math.abs(v.currentTime - ts) < 1e-6 && v.readyState >= 2) return; await new Promise(r => { v.onseeked = r; v.currentTime = ts; }); }

// ---------- frame(t) ----------
async function frame(g, t, comGrao = true, safe = q.has('safe')) {

      antesDaVoz_ms: +((vi - q1 / FPS) * 1000).toFixed(1), depoisDaVoz_ms: +(((q2 + 1) / FPS - vf) * 1000).toFixed(1), ok: q1 / FPS >= vi - 0.0005 && (q2 + 1) / FPS <= vf + 0.0005 }; });
  // ducking real medido: trilha no meio de cada fala x trilha sem ducking
  { const gl = final.lim.g, n = gl.length, pct = db => +(100 * gl.filter(v => 20 * Math.log10(v) < db).length / n).toFixed(2); R.limitador = { reducaoMax_dB: +final.lim.reducaoMaxDb.toFixed(2), tempoComReducao_pct: { maisDe1dB: pct(-1), maisDe3dB: pct(-3), maisDe6dB: pct(-6) } }; }
  R.duckingNoMeioDasFalas_dB = FALAS.map(f => +(20 * Math.log10(A.gd[Math.round((f.vozIni + f.vozFim) / 2 * SR)])).toFixed(2));

}
