<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Ep1 Bit</title>
<script src="brand.js"></script><script>document.write(`<link href="${BRAND.fontsCSS}" rel="stylesheet">`)</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="mascots.js"></script>
<style>body{margin:0;background:#05080f;color:#9aa;font:13px sans-serif}#wrap{display:grid;gap:6px;padding:6px}figure{margin:0}canvas{width:100%;display:block}</style></head><body><div id="wrap"></div>
<script>
// Episódio 1 do Bit: "POV: você é a ficha de papel da fábrica". 1080x1920, 30 fps, 18 s.
const W = 1080, H = 1920, FPS = 30, DUR = 18, POSTER_T = 2.6, OUTDIR = 'semana-2026-10-05', OUTNAME = 'Qui08_Instagram_TikTok_Ep1_Bit';
const C = { bg0: BRAND.ink, bg1: BRAND.ink2, info: BRAND.paper, light: BRAND.paper, rot: BRAND.mute, ink: BRAND.ink, accent: BRAND.accent };
let ctx;
const EC = {}; const E = n => EC[n] || (EC[n] = gsap.parseEase(n));
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x, P = (t, a, d) => cl((t - a) / d), lerp = (a, b, p) => a + (b - a) * p;
function T(s, x, y, o = {}) { const { size = 72, w = 900, color = C.light, align = 'left', alpha = 1, maxW = 912 } = o; if (alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.letterSpacing = (-0.035 * size) + 'px'; ctx.font = `${w} ${size}px "Geist"`; let m = ctx.measureText(s).width; if (m > maxW) { ctx.font = `${w} ${size * maxW / m}px "Geist"`; ctx.letterSpacing = (-0.035 * size * maxW / m) + 'px'; } ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y); ctx.restore(); }
function R(s, x, y, t, a, o = {}) { const p = E('expo.out')(P(t, a, 0.6)); ctx.save(); ctx.translate(0, (1 - p) * 40); T(s, x, y, { ...o, alpha: E('power2.out')(P(t, a, 0.28)) }); ctx.restore(); }
function bg(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function char(fn, expr, x, y, s, t, a = -1, ring) { // personagem com entrada (back.out) e respiração
  const p = a < 0 ? 1 : E('back.out(1.7)')(P(t, a, 0.45)); if (p <= 0) return;
  ctx.save(); ctx.translate(x, y + Math.sin(t * 3.2 + x) * 7); ctx.scale(s * p, s * p); ctx.translate(-300, -800); fn(ctx, expr, ring); ctx.restore();
}
function bubble(lines, x, y, w, t, a, tail = 'down') {
  const p = E('back.out(2)')(P(t, a, 0.35)); if (p <= 0) return; const h = 40 + lines.length * 66;
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(p, p); ctx.translate(-w / 2, -h / 2);
  // balão de canto reto com sombra dura no destaque (sem arredondado, sem desfoque)
  ctx.fillStyle = C.accent; ctx.fillRect(12, 12, w, h);
  ctx.fillStyle = C.light; ctx.strokeStyle = C.ink; ctx.lineWidth = 6; ctx.fillRect(0, 0, w, h); ctx.strokeRect(0, 0, w, h);
  ctx.beginPath(); const tx = tail === 'down' ? w * 0.28 : w * 0.7; ctx.moveTo(tx, h); ctx.lineTo(tx + (tail === 'down' ? -30 : 30), h + 56); ctx.lineTo(tx + (tail === 'down' ? 40 : -40), h); ctx.closePath(); ctx.fillStyle = C.light; ctx.fill(); ctx.stroke();
  ctx.fillRect(tx - 36, h - 8, 80, 10);
  lines.forEach((l, i) => T(l, 36, 74 + i * 66, { size: 50, w: 800, color: C.ink, maxW: w - 72 }));
  ctx.restore();
}
const MONO = Array(8).fill(BRAND.paper);
// ---- cenas ----
function sA(t) { // 0–3.4: o gancho
  bg(C.light);
  T('POV: você é a', 84, 330, { size: 96, color: C.ink }); T('ficha de papel', 84, 430, { size: 96, color: C.ink }); T('da fábrica.', 84, 530, { size: 96, color: C.accent });
  char(drawFicha, t < 1.9 ? 'dramatica' : 'esquecida', 540, 1520, 1.0, t);
  bubble(['Quanto produziu', 'ontem?'], 400, 610, 560, t, 1.5);
}
function sB(t) { // 3.4–7: não lembra
  bg(C.bg0);
  char(drawFicha, 'chorando', 540, 1300, 0.95, t);
  R('…eu não', 84, 1460, t, 3.75, { size: 120 }); R('lembro.', 84, 1570, t, 3.85, { size: 120, color: C.accent });
}
function sC(t) { // 7–11.4: o Bit lembra
  bg(C.light);
  char(drawFicha, 'chocada', 290, 1500, 0.78, t);
  const enter = E('expo.out')(P(t, 6.95, 0.6)); ctx.save(); ctx.translate(lerp(700, 0, enter), 0); char(drawCarretel, t < 8.9 ? 'tranquilo' : 'lembra', 790, 1500, 0.78, t, -1, MONO); ctx.restore();
  bubble(['Ontem: 18.420 m.', 'Turno 2 parou 1×:', 'troca de carretel.'], 84, 470, 760, t, 8.95, 'right');
}
function sD(t) { // 11.4–15.4
  bg(C.accent);
  R('O papel', 84, 380, t, 11.75, { size: 150, color: C.ink }); R('esquece.', 84, 530, t, 11.85, { size: 150, color: C.ink });
  char(drawFicha, 'amassada', 300, 1500, 0.78, t);
  char(drawCarretel, 'joinha', 790, 1500, 0.78, t, -1, MONO);
}
function sE(t) { // 15.4–18
  bg(C.bg0);
  char(drawCarretel, 'comemora', 540, 1500, 0.95, t, 15.5, MONO);
  R('O Bit', 84, 380, t, 15.6, { size: 150 }); R('lembra.', 84, 530, t, 15.7, { size: 150, color: C.accent });
}
const B = [0, 3.4, 7.0, 11.4, 15.4, 18], SCN = [sA, sB, sC, sD, sE];
function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  for (let j = 0; j < SCN.length - 1; j++) {
    const b = B[j + 1];
    if (t >= b - 0.1 && t < b + 0.28) {
      const p = E('expo.inOut')(P(t, b - 0.1, 0.38)); SCN[j](Math.min(t, b - 0.001));
      ctx.fillStyle = `rgba(2,6,23,${0.45 * p})`; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.beginPath(); ctx.rect(0, H * (1 - p), W, H * p); ctx.clip(); SCN[j + 1](t); ctx.restore(); grain(ctx, W, H); return;
    }
  }
  let i = 0; while (i < SCN.length - 1 && t >= B[i + 1]) i++; SCN[i](t); grain(ctx, W, H);
}
// ---- áudio: [início na fonte, início no vídeo, duração] ----
const MUSIC_EDL = [[32, 0, 18]];
const SFX_EDL = [[28.95, 1.45, 0.65], [3.80, 3.30, 0.45], [25.80, 6.80, 0.95], [15.70, 8.95, 0.6], [9.80, 11.30, 0.45], [59.40, 15.40, 2.6]];
const q = new URLSearchParams(location.search);
function place(dst, src, s0, d0, dur, gain = 1) { const SR = 48000, a = Math.round(s0 * SR), b = Math.round(d0 * SR), n = Math.round(dur * SR), f = Math.round(0.006 * SR); for (let c = 0; c < 2; c++) { const S = src.getChannelData(Math.min(c, src.numberOfChannels - 1)), D = dst[c]; for (let i = 0; i < n; i++) { const k = b + i; if (k >= D.length) break; D[k] += (S[a + i] || 0) * Math.min(1, i / f, (n - i) / f) * gain; } } }
async function render() {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; ctx = cv.getContext('2d', { alpha: false });
  const SR = 48000, len = SR * DUR, oac = new OfflineAudioContext(2, SR * 62, SR);
  const [mu, fx] = await Promise.all(['music', 'sfx'].map(n => fetch(`/w/stems/${n}.wav`).then(r => r.arrayBuffer()).then(b => oac.decodeAudioData(b))));
  const ch = [new Float32Array(len), new Float32Array(len)];
  for (const [s, d, n] of MUSIC_EDL) place(ch, mu, s, d, n, 0.85);
  const fo = Math.round(1.2 * SR); for (const c of ch) for (let i = 0; i < fo; i++) c[len - fo + i] *= 1 - i / fo; // música sai no fim
  for (const [s, d, n] of SFX_EDL) place(ch, fx, s, d, n, 0.9);
  let pk = 0; for (const c of ch) for (let i = 0; i < len; i++) pk = Math.max(pk, Math.abs(c[i])); const g = pk > 0.89 ? 0.89 / pk : 1; for (const c of ch) for (let i = 0; i < len; i++) c[i] *= g;
  const mux = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS }, audio: { codec: 'aac', numberOfChannels: 2, sampleRate: SR }, fastStart: 'in-memory' });
  let err = null; const ae = new AudioEncoder({ output: (c, m) => mux.addAudioChunk(c, m), error: e => err = e }); ae.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: 192000 });
  for (let i = 0; i < len; i += 1024) { const n = Math.min(1024, len - i), d = new Float32Array(n * 2); d.set(ch[0].subarray(i, i + n), 0); d.set(ch[1].subarray(i, i + n), n); const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i * 1e6 / SR), data: d }); ae.encode(ad); ad.close(); }
  await ae.flush();
  const ve = new VideoEncoder({ output: (c, m) => mux.addVideoChunk(c, m), error: e => err = e }); ve.configure({ codec: 'avc1.640032', width: W, height: H, bitrate: 10e6, framerate: FPS, avc: { format: 'avc' } });
  const NF = FPS * DUR;
  for (let f = 0; f < NF; f++) { if (err) throw err; frame(f === 0 ? POSTER_T : f / FPS); const vf = new VideoFrame(cv, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) }); ve.encode(vf, { keyFrame: f % 60 === 0 }); vf.close(); while (ve.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2)); if (f % 30 === 0) { document.title = `render ${f}/${NF}`; await new Promise(r => setTimeout(r, 0)); } }
  await ve.flush(); if (err) throw err; mux.finalize();
  await fetch(`/save?dir=${OUTDIR}&name=${OUTNAME}.mp4`, { method: 'POST', body: mux.target.buffer });
  frame(POSTER_T); await fetch(`/save?dir=${OUTDIR}&name=${OUTNAME}_capa.jpg`, { method: 'POST', body: await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92)) });
  document.title = 'DONE ' + (mux.target.buffer.byteLength / 1e6).toFixed(1) + ' MB';
}
function preview() { const wrap = document.getElementById('wrap'); wrap.style.gridTemplateColumns = `repeat(${q.get('c') || 4},1fr)`; for (const t of (q.get('t') || '2.6').split(',').map(Number)) { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; ctx = cv.getContext('2d', { alpha: false }); frame(t); wrap.append(cv); } document.title = 'ready'; }
loadBrandFonts().then(() => q.has('render') ? render() : preview()).catch(e => document.title = 'ERROR ' + e.message);
</script></body></html>
