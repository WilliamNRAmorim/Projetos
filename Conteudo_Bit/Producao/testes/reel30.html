//   S3 pilha: a barra LOW-CODE enche um segmento por ferramenta listada em STACK; "100%" = ferramentas low-code / ferramentas (calculado).

  c3a: `${FUNCOES.length} FUNÇÕES`, c3b: ['O MODELO DE', 'REFERÊNCIA DA', 'MANUFATURA'],

  tcc: 'ANÁLISE DO TCC EM ENGENHARIA DE COMPUTAÇÃO', parcelas: CATS.map(conta), total: FUNCOES.length,

const ROTEIRO = { p1: '6 IMPLEMENTADAS', p2a: '1 EM EXPANSÃO', p2b: '2 PARCIAIS', p3: '2 FORA DO ESCOPO', c3a: '11 FUNÇÕES', soma: '6 + 1 + 2 + 2 = 11', l1: '100% LOW-CODE', l2: 'POWER APPS · MICROSOFT LISTS', l3: 'POWER AUTOMATE · POWER BI' };

// ---------- tempos (s); tudo em quadro inteiro ----------
const TRI = Q(5); // 1/3 de batida a 120 BPM = 0,1667 s = 5 quadros
const T = {
  ganchoEntra: 28.0, ganchoSai: 1.8, cascata: i => 2.0 + Q(3 * i), marcadorChega: 4.0, punch: [4.0, 5.0],
  enche: i => FUNCOES[i] === 'I' ? 6.0 + 0.5 * i : FUNCOES[i] === 'E' ? 9.0 : FUNCOES[i] === 'P' ? 10.5 + 0.5 * (i - FUNCOES.indexOf('P')) : null,
  vermelho: 12.0, vermelhoParaFrase: 22.0, soma: [0, 1, 2, 3].map(k => 16.0 + k * TRI), encolhe: [18.5, 19.0], linhas: [0, 1, 2, 3].map(k => 19.0 + k * TRI),

// ---------- grade (objeto-guia): 11 quadrados retos 3 + 4 + 4, 140 px, folga 24 px ----------

function quadrado(i, t) { // estado visual do quadrado i em t, derivado de FUNCOES[i]

}
const FF = { x: RECT[9].x, y: RECT[9].y, w: RECT[10].x + SQ - RECT[9].x, h: SQ };
const MOV = [ // marcador (cursor da avaliação): [início, fim, de, para, easing]
  [3.5, 4.0, { ...RECT[0], x: RECT[0].x - 420 }, RECT[0], in2],
  ...[1, 2, 3, 4, 5, 6].map(i => [T.enche(i - 1), T.enche(i - 1) + 0.25, RECT[i - 1], RECT[i], out3]).map((m, k) => k === 5 ? [8.5, 8.75, m[2], m[3], out3] : m),
  [10.0, 10.25, RECT[6], RECT[7], out3], [10.5, 10.75, RECT[7], RECT[8], out3],
  [11.0, 11.5, RECT[8], { ...FF, y: FF.y - 24 }, out3], [11.6, 12.0, { ...FF, y: FF.y - 24 }, FF, in2], // assenta 24 px para baixo, acelerando, e para seco em 12,0

function marcador(t) {
  if (t < MOV[0][0] || t >= T.vermelho) return null;
  let r = MOV[0][2]; for (const [a, b, de, para, e] of MOV) { if (t < a) break; const k = t >= b ? 1 : e((t - a) / (b - a)); r = { x: lerp(de.x, para.x, k), y: lerp(de.y, para.y, k), w: lerp(de.w, para.w, k), h: lerp(de.h, para.h, k) }; }
  return r;
}

// ---------- texto: blocos medidos na fonte real, entrada e saída por máscara reta ----------
let LAY = null, ACC = null, CAIXAS = null; // ACC: destaques vermelhos do quadro; CAIXAS: caixas de texto visíveis (auditoria)
const acc = tag => { if (ACC) ACC.add(tag); return BRAND.accent; };
function fonte(g, f) { g.font = `${f.w} ${f.s}px ${f.mono ? '"Geist Mono"' : 'Geist'}`; g.letterSpacing = f.mono ? '0px' : `${-0.03 * f.s}px`; g.textBaseline = 'alphabetic'; g.textAlign = 'left'; }
function cabe(g, linhas, f, maxW, maxS) { let s = maxS; for (; s > 20; s--) { fonte(g, { ...f, s }); if (Math.max(...linhas.map(l => g.measureText(l).width)) <= maxW) break; } return s; }
function bloco(g, linhas, y0, y1) { // linhas: [{s, f, gap}] -> baselines e caixas de máscara, bloco centrado em y0..y1
  let y = 0; const out = linhas.map((l, k) => { fonte(g, l.f); const m = g.measureText(l.s), cap = (fonte(g, l.f), g.measureText('H').actualBoundingBoxAscent);
    if (k) y += (l.gap ?? 0.26 * l.f.s) + cap; else y = cap; const r = { ...l, b: y, asc: m.actualBoundingBoxAscent, desc: m.actualBoundingBoxDescent, w: m.width, cap }; return r; });
  const topo = -out[0].cap, fim = out.at(-1).b + out.at(-1).desc, dy = (y0 + y1) / 2 - (topo + fim) / 2;
  out.forEach(r => { r.b += dy; r.box = { y0: Math.floor(r.b - r.asc - 6), y1: Math.ceil(r.b + r.desc + 6) }; }); return out;
}
function cabeAltura(g, fazer, s0, y0, y1) { // maior tamanho em que o bloco cabe na faixa y0..y1 (com acentos e descendentes)
  for (let s = s0; s > 20; s--) { const L = bloco(g, fazer(s), y0, y1); if (L[0].b - L[0].asc >= y0 && L.at(-1).b + L.at(-1).desc <= y1) return L; } throw new Error('bloco não cabe');

function layout() {

  const sL1 = cabe(g, [TX.l1], D(), 850, 120), sM = cabe(g, [TX.l2, TX.l3, TX.l4], M(), 850, 46), sC2 = cabe(g, [TX.c2], M(), 850, 44), sT = cabe(g, [TX.tcc], M(0, 500), 850, 34), sS = cabe(g, [TX.soma], M(), 850, 84);
  const L = {};

  L.c2 = bloco(g, [{ s: TX.c2, f: M(sC2), cor: P }], ...Z);
  L.c3 = cabeAltura(g, S => [{ s: TX.c3a, f: M(40, 500), cor: MU }, ...TX.c3b.map((s, k) => ({ s, f: D(S), cor: P, gap: k ? undefined : 34 }))], s3, ...Z);
  L.p1 = bloco(g, [{ s: TX.p1, f: D(sP), cor: P }], ...Z);
  L.p2 = bloco(g, [{ s: TX.p2a, f: D(sP), cor: P }, { s: TX.p2b, f: D(sP), cor: P }], ...Z);
  L.p3 = bloco(g, [{ s: TX.p3, f: D(sP), cor: P }], ...Z);

  L.l = bloco(g, [{ s: TX.l1, f: D(sL1), cor: P }, { s: TX.l2, f: M(sM), cor: P, gap: 112 }, { s: TX.l3, f: M(sM), cor: P, gap: 26 }, { s: TX.l4, f: M(sM), cor: P, gap: 70 }], 520, 1000);
  L.barra = { x: 90, y: L.l[0].b + 28, w: 850, h: 22 };
  L.fecho = cabeAltura(g, S => TX.fecho.map((s, k) => ({ s, f: D(S), cor: k === 1 ? 'acc' : P })), sF, ...Z);
  { fonte(g, M(sS)); const b = L.tcc[1]; let x = 90; b.parc = []; const pedacos = []; TX.parcelas.forEach((n, k) => { pedacos.push(k ? ' + ' + n : '' + n); }); pedacos.push(` = ${TX.total}`);
    for (const p of pedacos) { b.parc.push({ s: p, x }); x += g.measureText(p).width; } }
  { const f = M(36); fonte(g, f); const tw = g.measureText(TX.balao).width; L.balao = { f, x1: 752, y0: 1252, y1: 1340, tw }; L.balao.x0 = L.balao.x1 - tw - 52; }

}
// item de texto: { tIn, ent (0 = corte seco no tempo forte; senão máscara em s, cada linha +2 quadros), fim (some por completo), sai (0 = corte seco em fim; senão máscara terminando em fim) }
// tt = tempo (o gancho usa t+30 antes de 14 s). Rótulos trocam por corte seco no tempo forte para a leitura plena caber nos 2 s do compasso.
const ITENS = () => [
  { id: 'gancho', L: LAY.gancho, tIn: T.ganchoEntra, ent: ENTRA, fim: T.ganchoSai + SAI + 30, sai: SAI, wrap: true },
  { id: 'c2', L: LAY.c2, tIn: 2.0, ent: 0, fim: 4.0, sai: 0 },
  { id: 'c3', L: LAY.c3, tIn: 4.0, ent: 0, fim: 6.0, sai: 0 },
  { id: 'p1', L: LAY.p1, tIn: 6.0, ent: 0, fim: 9.0, sai: 0 },
  { id: 'p2a', L: [LAY.p2[0]], tIn: 9.0, ent: 0, fim: 12.0, sai: 0 }, { id: 'p2b', L: [LAY.p2[1]], tIn: 9.5, ent: ENTRA, fim: 12.0, sai: 0 },
  { id: 'p3', L: LAY.p3, tIn: 12.0, ent: 0, fim: 16.0, sai: 0 },
  { id: 'tcc', L: [LAY.tcc[0]], tIn: 16.0, ent: 0, fim: T.encolhe[0], sai: 0 },
  ...[0, 1, 2, 3].map(k => ({ id: 'l' + (k + 1), L: [LAY.l[k]], tIn: T.linhas[k], ent: 0, fim: T.volta[0], sai: 0 })),

    if (CAIXAS) CAIXAS.push({ id: 'soma', x0: 90, x1: vis.at(-1).x + g.measureText(vis.at(-1).s).width, y0: b.b - b.asc, y1: b.b + b.desc }); }

// ---------- o Bit: rig 2D (bit_rig.js) em monocromático, pequeno, à direita; só reage ----------
const BIT = { x: 860, y: 1420, s: 220 / 685 }; // pés em (860, 1420), ~220 px de altura

  tilt: [[-1, 0], [2.0, -0.12], [4.0, -0.04], [6.0, 0], [19.0, -0.12], [22.0, 0]],
