<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Teste 3 · debounce (conceito)</title>
<script src="../brand.js"></script>
<script>document.write(`<link href="${BRAND.fontsCSS}" rel="stylesheet">`);</script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="audio_kit.js"></script>
<style>body{margin:0;background:#0C0C0D;color:#8C8B86;font:13px "Geist Mono",monospace}canvas{display:block;max-width:100%}pre{padding:8px;white-space:pre-wrap}</style>
</head><body>
<script>
// Teste 3 do playbook de motion (seção 5): simulação de 10 s, 1080x1920, 30 fps.
// CONCEITO: o firmware do Will Station não está no repositório, então isto NÃO é o código nem as medidas do hardware.
// É o algoritmo genérico de debounce rodando de verdade, amostra a amostra, sobre um sinal de botão com quiques gerados
// por ruído de semente fixa. Tempo e janela em unidades arbitrárias (amostras); nenhum número vai para a tela.
// Textos de tela: Producao/testes/textos_teste3_4.md (rótulos 1-3).
// URL: ?t=2.4 (quadro parado) · &safe=1 (área segura, igual ao ep_kit.js) · ?conf=1 (só folhas de conferência) · ?render=1 (tudo)
const W = 1080, H = 1920, FPS = 30, DUR = 10, GRAO = 0.07;
const q = new URLSearchParams(location.search);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), out = x => 1 - Math.pow(1 - x, 3), inC = x => x * x * x, inout = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

// ---------- o sinal: botão com quiques (ruído de semente fixa) ----------
const SEMENTE = 20261008, rnd = AudioKit.seed(SEMENTE);
const S = 120, SPS = 15, T0 = 0.3, JANELA = 16;          // 120 amostras, 1 amostra a cada 2 quadros, varredura 0,3-8,3 s; janela em amostras (unidade arbitrária)
const tAmostra = k => T0 + k / SPS;                       // instante (sempre em quadro inteiro) em que a amostra k é lida
const RAJADAS = [{ inicio: 8, trocas: 9 }, { inicio: 68, trocas: 5 }]; // apertar e soltar; número ímpar de trocas = o contato termina no outro estado
const trocas = []; for (const r of RAJADAS) { let k = r.inicio; for (let i = 0; i < r.trocas; i++) { trocas.push(k); k += 1 + Math.floor(rnd() * 3); } }
const bruto = new Uint8Array(S); { let v = 0, j = 0; for (let k = 0; k < S; k++) { while (j < trocas.length && trocas[j] === k) { v ^= 1; j++; } bruto[k] = v; } }

// ---------- o algoritmo: debounce clássico, rodando amostra a amostra como no loop de um microcontrolador ----------
function debounce(entrada, janela) {
  let ultimaLeitura = entrada[0], ultimaMudanca = 0, estado = entrada[0];
  const saida = [], espera = [], aceitos = [];
  for (let k = 0; k < entrada.length; k++) {
    const leitura = entrada[k];
    if (leitura !== ultimaLeitura) ultimaMudanca = k;            // mudou: reinicia o cronômetro
    if (k - ultimaMudanca >= janela && leitura !== estado) {      // ficou firme a janela inteira: aceita o novo estado
      estado = leitura; aceitos.push({ k, estado });
    }
    ultimaLeitura = leitura;
    saida.push(estado); espera.push(leitura !== estado ? ultimaMudanca : -1); // -1 = nada esperando
  }
  return { saida, espera, aceitos };
}
const SIM = debounce(bruto, JANELA);
const aperto = SIM.aceitos.find(a => a.estado === 1), soltura = SIM.aceitos.find(a => a.estado === 0);

// ---------- layout (tudo dentro de x 90-940, y 250-1480) ----------
const PX0 = 90, PX1 = 900, X = k => PX0 + k * (PX1 - PX0) / S;
const Y = { topo: 322, frase: 404, entrada: 750, eHi: 792, eLo: 972, janelaTxt: 1036, jan: 1054, janH: 28, saidaTxt: 1150, sHi: 1190, sLo: 1370, eixo: 1452 };
const FRASES = [ // rótulos aprovados no esqueleto (textos_teste3_4.md), sem ponto final; '|' = quebra de linha
  { txt: 'o botão treme', a: -1, b: 1.7 },
  { txt: 'espera o sinal|firmar', a: 2.0, b: 3.7 },
  { txt: 'um aperto,|um evento', a: 4.0, b: 8.4 },
  { txt: 'o botão treme', a: 9.1, b: 99 },               // volta ao quadro 0 (loop), parado de 9,55 s a 10 s
];
const SAI = { a: 8.5, b: 9.1 };                           // os traços descem e somem (acelerando); o cursor volta ao início

function mono(g, s, x, y, col, size = 28) { g.font = `700 ${size}px "Geist Mono"`; g.letterSpacing = '0px'; g.textAlign = 'left'; g.fillStyle = col; g.fillText(s, x, y); }
function frase(g, t) {
  const size = 104; g.font = `900 ${size}px Geist`; g.letterSpacing = `${-0.04 * size}px`; g.textBaseline = 'alphabetic';
  g.save(); g.beginPath(); g.rect(PX0 - 10, Y.frase - 30, 870, size * 2.6); g.clip();
  for (const f of FRASES) {
    if (t < f.a || t > f.b + 0.3) continue;
    const ent = f.a < 0 ? 1 : out(clamp((t - f.a) / 0.45)), sai = inC(clamp((t - f.b) / 0.3));
    const lines = f.txt.split('|').map(s => s.split(' '));
    if (lines.some(ln => g.measureText(ln.join(' ')).width > 850)) throw new Error('frase passa de 850 px: ' + f.txt);
    lines.forEach((ln, i) => { const y0 = Y.frase + size * 0.82 + i * size * 1.0, d = (1 - ent) * size * 2.4 * (1 + 0.25 * i) - sai * size * 2.4; g.fillStyle = BRAND.paper; g.fillText(ln.join(' '), PX0, y0 + d); });
  }
  g.restore(); g.letterSpacing = '0px';
}
function traco(g, arr, kf, yHi, yLo) {
  const n = Math.min(Math.floor(kf), arr.length - 1); if (kf <= 0) return;
  g.beginPath(); for (let k = 0; k <= n; k++) { const y = arr[k] ? yHi : yLo, xa = X(k), xb = X(Math.min(k + 1, kf)); if (k === 0) g.moveTo(xa, y); else g.lineTo(xa, y); g.lineTo(xb, y); } g.stroke();
}
function frame(g, t, comGrao = true) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = BRAND.ink; g.fillRect(0, 0, W, H);
  mono(g, 'CONCEITO · DEBOUNCE', PX0, Y.topo, BRAND.mute);
  frase(g, t);
  // elementos persistentes: rótulos e linhas de base (finas, mute)
  mono(g, 'entrada', PX0, Y.entrada, BRAND.mute); mono(g, 'janela', PX0, Y.janelaTxt, BRAND.mute); mono(g, 'saída', PX0, Y.saidaTxt, BRAND.mute);
  mono(g, 'tempo · unidades arbitrárias', PX0, Y.eixo, BRAND.mute, 24);
  g.fillStyle = BRAND.mute; g.fillRect(PX0, Y.eLo - 1, PX1 - PX0, 2); g.fillRect(PX0, Y.sLo - 1, PX1 - PX0, 2);
  // a simulação: lê até a amostra do cursor
  const kf = clamp((t - T0) * SPS, -1, S), kc = clamp(Math.floor(kf), 0, S - 1), us = clamp((t - SAI.a) / (SAI.b - SAI.a)), queda = 160 * us * us;
  if (us < 1) {
    g.save(); g.globalAlpha = 1 - us; g.translate(0, queda);
    g.lineWidth = 6; g.lineJoin = 'miter'; g.lineCap = 'butt'; g.strokeStyle = BRAND.paper;
    traco(g, bruto, kf, Y.eHi, Y.eLo); traco(g, SIM.saida, kf, Y.sHi, Y.sLo);
    // janela: o cronômetro corre desde a última mudança; cada quique reinicia; cheia = aceita
    const ini = kf >= 0 ? SIM.espera[kc] : -1;
    if (ini >= 0 && kf < S) {
      const x0 = X(ini), full = X(ini + JANELA) - x0, p = clamp((kf - ini) / JANELA);
      g.strokeStyle = BRAND.mute; g.lineWidth = 2; g.strokeRect(x0 + 1, Y.jan + 1, full - 2, Y.janH - 2);
      g.fillStyle = BRAND.accent; g.fillRect(x0, Y.jan, full * p, Y.janH);
    }
    // evento: um por aperto aceito (vermelho logo que nasce; nunca junto com a janela vermelha)
    if (aperto && kf >= aperto.k) {
      const ta = tAmostra(aperto.k), col = t < ta + 0.9 ? BRAND.accent : BRAND.paper, xe = X(aperto.k);
      g.fillStyle = col; g.fillRect(xe - 3, Y.sHi - 24, 6, Y.sLo - Y.sHi + 48); mono(g, 'evento', xe + 14, Y.sLo + 18, col, 26);
    }
    g.restore();
  }
  // cursor de leitura: anda com a amostragem; na saída volta ao início
  const xc = t < SAI.a ? X(Math.max(0, kf)) : X(S) + (X(0) - X(S)) * inout(us);
  g.fillStyle = BRAND.mute; g.fillRect(Math.round(xc) - 1, Y.eHi - 30, 2, Y.sLo - Y.eHi + 60);
  if (comGrao) grain(g, W, H, GRAO);
  if (q.has('safe')) safe(g);
}
function safe(g) { // mesmo overlay do ep_kit.js (?safe=1): nunca entra no render
  g.save(); g.fillStyle = 'rgba(255,59,31,0.18)'; g.fillRect(0, 0, W, 250); g.fillRect(0, 1480, W, H - 1480); g.fillRect(940, 900, W - 940, 580);
  g.strokeStyle = '#FF3B1F'; g.lineWidth = 3; g.setLineDash([14, 10]); g.strokeRect(90, 250, 850, 1230); g.restore();
}

// ---------- eventos de áudio (todos saem da simulação; pico no quadro) ----------
const EV = [
  ...trocas.map((k, i) => ({ nome: `quique ${i + 1}`, tipo: 'tique', semente: i, t: (9 + 2 * k) / 30, nivel: 0.12, folha: i === 0, visual: 'entrada troca de nível (quique do contato)' })),
  { nome: 'aceita aperto', tipo: 'clique', t: (9 + 2 * aperto.k) / 30, nivel: 0.3, visual: 'janela enche, saída sobe, marca de evento vermelha' },
  { nome: 'swoosh desce (saída cai)', tipo: 'swooshDesce', dur: 0.32, t: (9 + 2 * soltura.k) / 30, nivel: 0.22, visual: 'janela enche na soltura, saída desce para o nível baixo' },
  { nome: 'swoosh desce (traços saem)', tipo: 'swooshDesce', dur: 0.6, t: SAI.b, nivel: 0.26, visual: 'traços descem acelerando e somem (8,5-9,1 s)' },
];
const SIMINFO = { conceito: true, nota: 'algoritmo genérico, não é o firmware do Will Station; unidades arbitrárias', semente: SEMENTE, amostras: S, janela_amostras: JANELA,
  trocasNaEntrada: trocas.length, eventosAceitos: SIM.aceitos.length, apertosAceitos: SIM.aceitos.filter(a => a.estado === 1).length,
  aperto_s: tAmostra(aperto.k), soltura_s: tAmostra(soltura.k), ultimoQuiqueAperto_s: tAmostra(trocas[RAJADAS[0].trocas - 1]), ultimoQuiqueSoltura_s: tAmostra(trocas.at(-1)) };

// ---------- conferência: folha por compasso com área segura, 8 quadros, loop ----------
async function conferencia() {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d', { willReadFrequently: true });
  const folha = async (ts, nome, cols, comSafe) => {
    const sw = 270, sh = 480, sheet = document.createElement('canvas'); sheet.width = sw * cols; sheet.height = sh * Math.ceil(ts.length / cols); const sg = sheet.getContext('2d');
    ts.forEach(([t, r], i) => { frame(g, t); if (comSafe) safe(g); const x = (i % cols) * sw, y = Math.floor(i / cols) * sh; sg.drawImage(cv, x, y, sw, sh); sg.font = '700 17px "Geist Mono"'; sg.fillStyle = '#FF3B1F'; sg.fillText(`${r} ${t.toFixed(2)}s q${Math.round(t * FPS)}`, x + 6, y + 470); });
    await AudioKit.salvar(nome, await new Promise(r => sheet.toBlob(r, 'image/png')));
  };
  await folha([0, 2, 4, 6, 8, 299 / 30].map((t, i) => [t, 'c' + (i + 1)]), 'teste3_folha_compasso.png', 6, true);
  const qa = tAmostra(aperto.k), qs = tAmostra(soltura.k);
  await folha([[1.2, 'gancho'], [2.4, 'janela'], [qa, 'aceita'], [4.6, 'evento'], [5.9, 'soltura'], [qs, 'cai'], [8.8, 'sai'], [299 / 30, 'q299']], 'teste3_8quadros.png', 4, false);
  const px = t => { frame(g, t, false); return g.getImageData(0, 0, W, H).data; };
  const dif = (a, b) => { let n = 0; for (let i = 0; i < a.length; i += 4) if (a[i] !== b[i] || a[i + 1] !== b[i + 1] || a[i + 2] !== b[i + 2]) n++; return n; };
  const f0 = px(0), loop = { pixelsDiferentes_q0_x_t10: dif(f0, px(10)), pixelsDiferentes_q0_x_q299: dif(f0, px(299 / 30)), pixelsDiferentes_q0_x_q287: dif(f0, px(287 / 30)), nota: 'sem grão (o grão é a mesma textura semeada em todo quadro)' };
  // vermelho: no máximo 1 objeto por quadro (janela OU marca de evento) — confere a regra pela lógica em todos os 300 quadros
  let quadrosComDoisVermelhos = 0; for (let f = 0; f < 300; f++) { const t = f / FPS, kf = clamp((t - T0) * SPS, -1, S), kc = clamp(Math.floor(kf), 0, S - 1);
    const jan = kf >= 0 && kf < S && SIM.espera[kc] >= 0 && t < SAI.b, ev = aperto && kf >= aperto.k && t < tAmostra(aperto.k) + 0.9; if (jan && ev) quadrosComDoisVermelhos++; }
  return { loop, quadrosComDoisVermelhos };
}

async function preview() { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.append(cv); frame(cv.getContext('2d'), +(q.get('t') || 0)); document.title = 'ready'; }
async function main() {
  await loadBrandFonts();
  if (q.has('conf')) { const c = await conferencia(); await AudioKit.salvar('teste3_conferencia.json', new Blob([JSON.stringify({ simulacao: SIMINFO, ...c, eventos: EV.map(e => [e.nome, e.t]) }, null, 2)])); document.title = 'DONE'; return; }
  if (!q.has('render')) return preview();
  const c = await conferencia();
  await AudioKit.render({ prefixo: 'teste3_debounce', W, H, FPS, DUR, frame, eventos: EV, duck: { maxDb: -10, ref: 0.12 }, extra: { simulacao: SIMINFO, ...c } });
}
main().catch(e => { document.title = 'ERROR ' + e.message; AudioKit.salvar('teste3_erro.txt', new Blob([String(e.stack || e)])); });
</script>
</body></html>
