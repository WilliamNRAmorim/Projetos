<style>body{margin:0;background:#0C0C0D;color:#8C8B86;font:13px "Geist Mono",monospace}canvas{display:block;max-width:100%}pre{padding:8px;white-space:pre-wrap}</style>

<script>
// Teste 4 do playbook de motion (seção 5): frase cinética travada, 8 s, 1080x1920, 30 fps.
// Frase aprovada (textos_teste3_4.md): "Engenharia é o erro que você aprendeu a ler". "erro" vira o objeto-guia (bloco que
// destaca a palavra, sai dela e vira o cursor que escreve o resto); "ler" é o ÚNICO destaque #FF3B1F.
// frame(t) puro (sem timer, sem estado), loop frame(0) == frame(8) (tela vazia), respiro parado 5,6-7,2 s, grão com semente (brand.js).
// Áudio como no teste 5 (pico no evento, AAC, LUFS/dBTP medidos depois do AAC) + swoosh descendente em todo movimento para baixo
// + ducking: a trilha abaixa sob os efeitos (sidechain), o limitador fica só para picos da trilha.
// URL: ?t=1.5 (quadro parado) · ?safe=1 (overlay da área segura, igual ao ep_kit.js) · ?render=1 (mp4 + json + png via /save)
const W = 1080, H = 1920, FPS = 30, DUR = 8, SR = 48000, N = SR * DUR, NF = DUR * FPS, GRAO = 0.07;
const ALVO_LUFS = -14, TETO_LIMITADOR = -1.5, BITRATE = 192000, DUCK_DB = 8;
const q = new URLSearchParams(location.search);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, p) => a + (b - a) * p;
const out3 = x => 1 - Math.pow(1 - x, 3), in2 = x => x * x, in3 = x => x * x * x, inout = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const OMEGA = 16, mola = u => u <= 0 ? 0 : u >= 0.58 ? 1 : 1 - (1 + OMEGA * u) * Math.exp(-OMEGA * u); // fecha em 0,58 s (resíduo < 0,04 px; 0,6 s caía em 0,5999... por ponto flutuante)

// ---------- tempos (s) ----------
const T = {
  l1: 0.10, l2: 0.50, erroCai: [0.70, 1.00], marca: 1.50, desce3: [2.00, 2.30], corre3: [2.30, 2.90], desce4: [2.90, 3.20],
  corre4: [3.20, 3.80], desce5: [4.00, 4.40], ler: 5.00, respiro: [5.60, 7.20], saida: 7.20, saidaDur: 0.35, saidaPasso: 0.05,
};
T.saidaFim = T.saida + 4 * T.saidaPasso + T.saidaDur; // 7,75
const EV = [ // evento visual -> efeito, com o PICO do efeito no tempo do evento
  { nome: 'clique', t: T.l1, visual: '"Engenharia" entra pela máscara' },
  { nome: 'clique', t: T.l2, visual: '"é o" entra pela máscara' },
  { nome: 'swooshDesce', t: T.erroCai[1], dur: 0.30, visual: '"erro" cai de cima e para seco na linha' },
  { nome: 'selecao', t: T.marca, visual: 'bloco cobre "erro": a palavra vira objeto' },
  { nome: 'swooshDesce', t: T.desce3[1], dur: 0.30, visual: 'bloco desce para a linha 3' },
  { nome: 'swooshDesce', t: T.desce4[1], dur: 0.30, visual: 'bloco desce para a linha 4' },
  { nome: 'swooshDesce', t: T.desce5[1], dur: 0.40, visual: 'bloco desce para a linha 5' },
  { nome: 'impacto', t: T.ler, visual: '"ler" crava em vermelho' },
  { nome: 'swooshDesce', t: T.saidaFim, dur: 0.55, visual: 'frase afunda nas máscaras e some (volta ao quadro 0)' },
];

// ---------- layout (medido na fonte real depois de carregar a Geist) ----------
let L = null;
function setFont(g, s) { g.font = `900 ${s}px Geist`; g.letterSpacing = `${-0.04 * s}px`; g.textBaseline = 'alphabetic'; g.textAlign = 'left'; }
function layout(g) {
  const linhas = ['Engenharia', 'é o erro', 'que você', 'aprendeu a'];
  setFont(g, 100); const lw = linhas.map(s => g.measureText(s).width);
  const S = Math.floor(Math.min(160, ...lw.map(w => 85000 / (w + 52)))), S5 = Math.round(S * 1.7), lh = S * 1.08; // linha + folga + cursor (0,52 S) cabem em x 90-940
  setFont(g, S); const w = s => g.measureText(s).width;
  const top = (250 + 1480) / 2 - (4 * lh + S5 * 1.0) / 2; // bloco de texto centrado na área segura
  const b = [0, 1, 2, 3].map(i => top + S * 0.95 + i * lh); b.push(b[3] + S * 0.28 + S5 * 0.95);
  const xErro = 90 + w('é o ');
  const L0 = { S, S5, lh, b, xErro, wErro: w('erro'), w1: w('Engenharia'), w2: w('é o'), w3: w('que você'), w4: w('aprendeu a') };
  setFont(g, S5); L0.wLer = g.measureText('ler').width;
  L0.box = i => i < 4 ? { y0: b[i] - S * 1.0, y1: b[i] + S * 0.27 } : { y0: b[4] - S5 * 1.0, y1: b[4] + S5 * 0.27 };
  L0.cur = i => { const s = i < 4 ? S : S5; return { w: 0.40 * s, h: 0.70 * s, y: b[i] - 0.70 * s }; };
  return L0;
}

// ---------- estado puro do objeto-guia ----------
function bloco(t) {
  const { S, b, xErro, wErro } = L, pad = 0.07 * S;
  const A = { x: xErro - pad, y: b[1] - 0.66 * S, w: wErro + 2 * pad, h: 0.66 * S + 0.16 * S }; // destaque sobre "erro"
  const C = i => ({ x: 90, ...L.cur(i) }), Fim = (i, wl) => ({ ...C(i), x: 90 + wl + 0.10 * (i < 4 ? S : L.S5) });
  const mix = (P, Q, p) => ({ x: lerp(P.x, Q.x, p), y: lerp(P.y, Q.y, p), w: lerp(P.w, Q.w, p), h: lerp(P.h, Q.h, p) });
  if (t < T.marca) return null;
  if (t < T.desce3[0]) return { ...A, w: A.w * out3(clamp((t - T.marca) / 0.15)) };
  if (t < T.desce3[1]) return mix(A, C(2), in2((t - T.desce3[0]) / (T.desce3[1] - T.desce3[0])));        // cai acelerando, para seco
  if (t < T.corre3[1]) return mix(C(2), Fim(2, L.w3), inout((t - T.corre3[0]) / (T.corre3[1] - T.corre3[0])));
  if (t < T.desce4[0]) return Fim(2, L.w3);
  if (t < T.desce4[1]) return mix(Fim(2, L.w3), C(3), in2((t - T.desce4[0]) / (T.desce4[1] - T.desce4[0])));
  if (t < T.corre4[1]) return mix(C(3), Fim(3, L.w4), inout((t - T.corre4[0]) / (T.corre4[1] - T.corre4[0])));
  if (t < T.desce5[0]) return Fim(3, L.w4);
  if (t < T.desce5[1]) return mix(Fim(3, L.w4), C(4), in2((t - T.desce5[0]) / (T.desce5[1] - T.desce5[0])));

  return { ...Fim(4, L.wLer * escalaLer(t)), linha: 4 };
}
const escalaLer = t => t < T.ler ? 1 : 1 + 0.08 * (1 - mola(t - T.ler));
const desceSaida = (i, t) => in3(clamp((t - T.saida - i * T.saidaPasso) / T.saidaDur)); // 0..1 da altura da máscara
function revela(i, t) { // até onde (x) a linha i já foi escrita pelo cursor
  if (i < 2) return W;
  const k = bloco(t); if (!k) return 0;
  if (i === 2) return t < T.corre3[0] ? 0 : t < T.corre3[1] ? k.x : W;
  if (i === 3) return t < T.corre4[0] ? 0 : t < T.corre4[1] ? k.x : W;
  return t < T.ler ? 0 : W;
}

// ---------- frame(t) puro ----------
function linha(g, i, t, draw) { // máscara reta da linha i, com descida de saída
  const bx = L.box(i), h = bx.y1 - bx.y0, off = desceSaida(i, t) * h;
  g.save(); g.beginPath(); g.rect(0, bx.y0, W, h); g.clip(); g.translate(0, off); draw(); g.restore();
}
function frame(g, t, comGrao = true, safe = q.has('safe')) {
  t = ((t % DUR) + DUR) % DUR;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = BRAND.ink; g.fillRect(0, 0, W, H);
  const { S, S5, b, xErro } = L, bxH = i => L.box(i).y1 - L.box(i).y0;
  // linha 1 e "é o": entram secas pela máscara (de baixo para cima, out cúbico 0,30 s)
  const sobe = t0 => (1 - out3(clamp((t - t0) / 0.30))) * bxH(0);
  linha(g, 0, t, () => { if (t >= T.l1) { setFont(g, S); g.fillStyle = BRAND.paper; g.fillText('Engenharia', 90, b[0] + sobe(T.l1)); } });
  linha(g, 1, t, () => {
    setFont(g, S); g.fillStyle = BRAND.paper;
    if (t >= T.l2) g.fillText('é o', 90, b[1] + sobe(T.l2));
    if (t >= T.erroCai[0]) g.fillText('erro', xErro, b[1] - (1 - in2(clamp((t - T.erroCai[0]) / (T.erroCai[1] - T.erroCai[0])))) * bxH(1)); // cai e para seco
  });
  for (const [i, s] of [[2, 'que você'], [3, 'aprendeu a']]) {
    const rx = revela(i, t); if (rx <= 90) continue;
    linha(g, i, t, () => { g.beginPath(); g.rect(0, 0, rx, H); g.clip(); setFont(g, S); g.fillStyle = BRAND.paper; g.fillText(s, 90, b[i]); });
  }
  if (t >= T.ler) linha(g, 4, t, () => { const s = escalaLer(t); g.translate(90, b[4]); g.scale(s, s); setFont(g, S5); g.fillStyle = BRAND.accent; g.fillText('ler', 0, 0); });
  // objeto-guia: o bloco (a palavra "erro" virou objeto)
  const k = bloco(t);
  if (k) {
    const desenha = () => { g.fillStyle = BRAND.paper; g.fillRect(k.x, k.y, k.w, k.h);
      if (t < T.desce3[1]) { g.save(); g.beginPath(); g.rect(k.x, k.y, k.w, k.h); g.clip(); setFont(g, S); g.fillStyle = BRAND.ink; g.fillText('erro', xErro, b[1]); g.restore(); } };
    if (k.linha === 4) linha(g, 4, t, desenha); else desenha();
  }
  if (comGrao) grain(g, W, H, GRAO);
  if (safe) { // mesma conferência do ep_kit.js (?safe=1): nunca entra no render
    g.save(); g.fillStyle = 'rgba(255,59,31,0.18)'; g.fillRect(0, 0, W, 250); g.fillRect(0, 1480, W, H - 1480); g.fillRect(940, 900, W - 940, 580);
    g.strokeStyle = '#FF3B1F'; g.lineWidth = 3; g.setLineDash([14, 10]); g.strokeRect(90, 250, 850, 1230); g.restore();
  }
}

// ---------- áudio: síntese ----------
function seed(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

async function sintetiza(e, idx) {

  if (nome === 'clique' || nome === 'selecao') {

    g1.gain.setValueAtTime(0, 0); g1.gain.linearRampToValueAtTime(1, 0.0015); g1.gain.exponentialRampToValueAtTime(0.001, sel ? 0.08 : 0.05);
    const o = ac.createOscillator(), g2 = ac.createGain(); o.frequency.value = sel ? 1100 : 2200; g2.gain.setValueAtTime(0, 0); g2.gain.linearRampToValueAtTime(0.5, 0.001); g2.gain.exponentialRampToValueAtTime(0.001, sel ? 0.12 : 0.07);
    n.connect(bp).connect(g1).connect(ac.destination); o.connect(g2).connect(ac.destination); n.start(0); o.start(0);
  } else if (nome === 'impacto') {
    const o = ac.createOscillator(), g1 = ac.createGain(); o.frequency.setValueAtTime(150, 0); o.frequency.exponentialRampToValueAtTime(42, 0.18);
    g1.gain.setValueAtTime(0, 0); g1.gain.linearRampToValueAtTime(1, 0.004); g1.gain.exponentialRampToValueAtTime(0.001, 0.42);
    const n = ruido(ac, dur, 22), lp = ac.createBiquadFilter(), g2 = ac.createGain(); lp.type = 'lowpass'; lp.frequency.value = 900;
    g2.gain.setValueAtTime(0, 0); g2.gain.linearRampToValueAtTime(0.35, 0.002); g2.gain.exponentialRampToValueAtTime(0.001, 0.035);
    o.connect(g1).connect(ac.destination); n.connect(lp).connect(g2).connect(ac.destination); o.start(0); n.start(0);
  } else { // swoosh DESCENDENTE: ruído filtrado e seno com o pitch em queda, envelope sobe até o fim do movimento (= pico) e corta
    const d = e.dur, n = ruido(ac, dur, 33 + idx), bp = ac.createBiquadFilter(), g1 = ac.createGain(); bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(3600, 0); bp.frequency.exponentialRampToValueAtTime(380, d);
    g1.gain.setValueAtTime(0.001, 0); g1.gain.exponentialRampToValueAtTime(1, d); g1.gain.linearRampToValueAtTime(0, d + 0.09);
    const o = ac.createOscillator(), g2 = ac.createGain(); o.frequency.setValueAtTime(1300, 0); o.frequency.exponentialRampToValueAtTime(150, d);
    g2.gain.setValueAtTime(0.001, 0); g2.gain.exponentialRampToValueAtTime(0.22, d); g2.gain.linearRampToValueAtTime(0, d + 0.09);
    n.connect(bp).connect(g1).connect(ac.destination); o.connect(g2).connect(ac.destination); n.start(0); o.start(0);
  }
  return (await ac.startRendering()).getChannelData(0).slice();
}
const picoAmostra = (x, a = 0, b = x.length) => { let m = 0, k = a; for (let i = a; i < b; i++) { const v = Math.abs(x[i]); if (v > m) { m = v; k = i; } } return { k, v: m }; };
function picoEnvelope(x, a = 0, b = x.length, jan = 480) { let s = 0, m = 0, k = a; const h = jan >> 1;
  for (let i = Math.max(0, a - h); i < Math.min(x.length, a + h); i++) s += x[i] * x[i];
  for (let i = a; i < b; i++) { const add = i + h, sub = i - h; if (add < x.length) s += x[add] * x[add]; if (sub >= 0) s -= x[sub] * x[sub]; if (s > m) { m = s; k = i; } }
  return { k, rms: Math.sqrt(Math.max(m, 0) / jan) }; }

// ---------- medição: BS.1770-4 e true peak (mesma do teste 5) ----------
function biquad(x, b, a) { const y = new Float32Array(x.length); let x1 = 0, x2 = 0, y1 = 0, y2 = 0; for (let i = 0; i < x.length; i++) { const v = b[0] * x[i] + b[1] * x1 + b[2] * x2 - a[1] * y1 - a[2] * y2; x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v; } return y; }
function lufs(chs) {
  const K = c => biquad(biquad(c, [1.53512485958697, -2.69169618940638, 1.19839281085285], [1, -1.69065929318241, 0.73248077421585]), [1, -2, 1], [1, -1.99004745483398, 0.99007225036621]);
  const kw = chs.map(K), bl = 0.4 * SR, st = 0.1 * SR, z = [];

const FIR = (() => { const Tp = 48, P = 4, h = new Float32Array(Tp * P); for (let i = 0; i < Tp * P; i++) { const n = i - (Tp * P - 1) / 2, x = n / P, s = x === 0 ? 1 : Math.sin(Math.PI * x) / (Math.PI * x), w = 0.42 - 0.5 * Math.cos(2 * Math.PI * i / (Tp * P - 1)) + 0.08 * Math.cos(4 * Math.PI * i / (Tp * P - 1)); h[i] = s * w; } return { h, Tp, P }; })();

const truePeak = chs => dB(Math.max(...chs.map(c => truePeakSerie(c).reduce((a, b) => b > a ? b : a, 0))));

  const teto = Math.pow(10, tetoDb / 20), n = chs[0].length, Lk = 240, rel = 1 - Math.exp(-1 / (0.1 * SR));

// ducking: envelope do stem de efeitos (lookahead 10 ms, ataque 5 ms, soltura 180 ms) -> ganho da trilha em dB
function curvaDucking(sfx, refPico) {

// ---------- AAC + vídeo ----------
async function codificaAAC(chs, video) {

  const ae = new AudioEncoder({ output: (c, m) => mux.addAudioChunk(c, m), error: e => err = e }); ae.configure({ codec: 'mp4a.40.2', sampleRate: SR, numberOfChannels: 2, bitrate: BITRATE });

  for (let i = 0; i < N; i += 1024) { const n = Math.min(1024, N - i), d = new Float32Array(n * 2); d.set(A.subarray(i, i + n), 0); d.set(B.subarray(i, i + n), n); const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i * 1e6 / SR), data: d }); ae.encode(ad); ad.close(); }

    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
    const ve = new VideoEncoder({ output: (c, m) => mux.addVideoChunk(c, m), error: e => err = e }); ve.configure({ codec: 'avc1.640032', width: W, height: H, bitrate: 3.2e6, framerate: FPS });
    for (let f = 0; f < NF; f++) { frame(g, f / FPS, true, false); const vf = new VideoFrame(cv, { timestamp: Math.round(f * 1e6 / FPS) }); ve.encode(vf, { keyFrame: f % 60 === 0 }); vf.close(); if (ve.encodeQueueSize > 10) await new Promise(r => setTimeout(r, 5)); document.title = `video ${f}/${NF}`; }
