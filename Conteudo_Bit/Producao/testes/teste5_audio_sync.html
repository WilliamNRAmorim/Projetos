<script>
// Teste 5 do playbook de motion (seção 5): 3 efeitos sintetizados (WebAudio/OfflineAudioContext) com o PICO no evento visual,
// sobre stems/music.wav, mix em -14 LUFS / -1 dBTP medidos DEPOIS do AAC (WebCodecs mp4a.40.2, decodificado de volta e medido aqui:
// BS.1770-4 com porta absoluta -70 e relativa -10, true peak por sobreamostragem 4x).
// URL: ?t=0,2,5,8 (quadros parados) · ?render=1 (gera mp4 + json + png em Producao/testes via /save, servidor na porta 5179)
const W = 1080, H = 1920, FPS = 30, DUR = 10, SR = 48000, N = SR * DUR, GRAO = 0.07;
const ALVO_LUFS = -14, TETO_LIMITADOR = -1.5, BITRATE = 192000;
const q = new URLSearchParams(location.search);

  { nome: 'clique', t: 2.0, visual: 'quadrado vira vermelho e encolhe (troca seca + mola)' },
  { nome: 'impacto', t: 5.0, visual: 'quadrado cai e para seco na linha do chão' },
  { nome: 'whoosh', t: 8.0, visual: 'quadrado sobe acelerando e para no centro (volta ao quadro 0)' },

const CHAO = 1300;

// ---------- visual: frame(t) puro ----------
function estado(t) {

  if (t < 5.0) { // E1 em 2,0 s: troca seca para vermelho + mola de 300 para 200; 4,4-5,0 cai acelerando e para seco no chão (E2)
    const s = 300 - 100 * mola(t - 2.0), u = clamp((t - 4.4) / 0.6);
    return { x, y: 900 + (CHAO - s / 2 - 900) * u * u, s, red: true };
  }
  if (t < 6.8) return { x, y: CHAO - 100, s: 200, red: false };                    // parado no chão
  const u = (t - 6.8) / 1.2, e = u * u * u;                                           // sobe acelerando, para seco no centro em 8,0 s
  return { x, y: (CHAO - 100) + (900 - (CHAO - 100)) * e, s: 200 + 100 * e, red: false };

function frame(g, t, comGrao = true) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = BRAND.ink; g.fillRect(0, 0, W, H);

// ---------- áudio: síntese ----------

  if (nome === 'clique') {

    n.connect(bp).connect(g1).connect(ac.destination); o.connect(g2).connect(ac.destination); n.start(0); o.start(0);
  } else if (nome === 'impacto') {
    const o = ac.createOscillator(), g1 = ac.createGain(); o.frequency.setValueAtTime(150, 0); o.frequency.exponentialRampToValueAtTime(42, 0.18);
    g1.gain.setValueAtTime(0, 0); g1.gain.linearRampToValueAtTime(1, 0.004); g1.gain.exponentialRampToValueAtTime(0.001, 0.42);
    const n = ruido(ac, dur, 22), lp = ac.createBiquadFilter(), g2 = ac.createGain(); lp.type = 'lowpass'; lp.frequency.value = 900;

    o.connect(g1).connect(ac.destination); n.connect(lp).connect(g2).connect(ac.destination); o.start(0); n.start(0);

    const n = ruido(ac, dur, 33), bp = ac.createBiquadFilter(), g1 = ac.createGain(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(400, 0); bp.frequency.exponentialRampToValueAtTime(3200, 0.45);

const picoAmostra = (x, a = 0, b = x.length) => { let m = 0, k = a; for (let i = a; i < b; i++) { const v = Math.abs(x[i]); if (v > m) { m = v; k = i; } } return { k, v: m }; };

// ---------- medição: BS.1770-4 e true peak ----------

const truePeak = chs => dB(Math.max(...chs.map(c => truePeakSerie(c).reduce((a, b) => b > a ? b : a, 0))));

// ---------- AAC ----------

async function render() {

  const nivel = { clique: 0.3, impacto: 0.45, whoosh: 0.3 }; // pico de amostra de cada efeito antes do ganho do mix
  for (const e of EV) { const x = fx[e.nome], p = picoAmostra(x); for (let i = 0; i < x.length; i++) x[i] *= nivel[e.nome] / p.v;

    lufsIntegrado: +lufs(dec.chs).toFixed(2), dbtp: +truePeak(dec.chs).toFixed(2), picoAmostra_dBFS: +picoAmostraDb(dec.chs).toFixed(2) };
