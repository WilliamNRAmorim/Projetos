<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Teste 1 · forma única em loop</title>
<script src="../brand.js"></script>
<script>document.write(`<link href="${BRAND.fontsCSS}" rel="stylesheet">`);</script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>body{margin:0;background:#0C0C0D;color:#8C8B86;font:13px "Geist Mono",monospace}canvas{display:block;max-width:100%}pre{padding:8px;white-space:pre-wrap}</style>
</head><body>
<script>
// Teste 1 do playbook de motion (seção 5): um quadrado reto off-white, 3 molas fechadas amortecidas criticamente, loop de 6 s.
// frame(t) é função pura do tempo: sem timers, sem CSS transition, sem estado entre quadros. Grão do brand.js (semente fixa).
// URL: ?t=0,2.2 (quadros parados) · ?fps=30|60&render=1 (gera mp4 em Producao/testes via /save) · ?check=1 (verificações)
const W = 1080, H = 1920, DUR = 6, OMEGA = 14, GRAO = 0.07;
const q = new URLSearchParams(location.search), FPS = +(q.get('fps') || 30);

// estados (centro x, centro y, lado), dentro da safe area x 90-940 / y 250-1480. Só o estado 1 é vermelho.
const S = [
  { x: 540, y: 900,  s: 360, red: false },
  { x: 700, y: 560,  s: 200, red: true },
  { x: 380, y: 1240, s: 460, red: false },
];
const A = [0.5, 2.5, 4.5]; // início de cada mola, no tempo forte (120 BPM = 2 s por compasso); a 3a volta ao estado 0
const mola = u => u <= 0 ? 0 : 1 - (1 + OMEGA * u) * Math.exp(-OMEGA * u); // x(t) = 1 - (1 + w t) e^(-w t)

function estado(t) {
  let x = S[0].x, y = S[0].y, s = S[0].s;
  for (let k = 0; k < 3; k++) {
    const de = S[k], para = S[(k + 1) % 3], p = mola(t - A[k]); // cada troca de alvo soma uma mola nova
    x += (para.x - de.x) * p; y += (para.y - de.y) * p; s += (para.s - de.s) * p;
  }
  const red = t >= A[0] && t < A[1]; // o vermelho existe em um único estado (troca seca no tempo forte)
  return { x, y, s, red };
}

function frame(g, t, comGrao = true) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = BRAND.ink; g.fillRect(0, 0, W, H);
  const e = estado(t);
  g.fillStyle = e.red ? BRAND.accent : BRAND.paper;
  g.fillRect(e.x - e.s / 2, e.y - e.s / 2, e.s, e.s); // cantos retos
  if (comGrao) grain(g, W, H, GRAO);
}

const novo = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d', { alpha: false, willReadFrequently: true })]; };
const salvar = (name, body) => fetch(`/save?name=${name}`, { method: 'POST', body });
const png = c => new Promise(r => c.toBlob(r, 'image/png'));
function diff(a, b) { // pixels diferentes e maior diferença de canal
  const da = a.getImageData(0, 0, W, H).data, db = b.getImageData(0, 0, W, H).data; let n = 0, mx = 0;
  for (let i = 0; i < da.length; i += 4) { const d = Math.max(Math.abs(da[i] - db[i]), Math.abs(da[i + 1] - db[i + 1]), Math.abs(da[i + 2] - db[i + 2])); if (d) { n++; if (d > mx) mx = d; } }
  return { pixelsDiferentes: n, maiorDiferenca: mx };
}

async function check() {
  const out = {}, [ca, ga] = novo(), [cb, gb] = novo();
  const e0 = estado(0), e6 = estado(DUR);
  out.residuoMolaPx = { x: e6.x - e0.x, y: e6.y - e0.y, lado: e6.s - e0.s };
  frame(ga, 0, false); frame(gb, DUR, false); out.render0_vs_render6_semGrao = diff(ga, gb);
  frame(ga, 0); frame(gb, DUR); out.render0_vs_render6_comGrao = diff(ga, gb);
  for (const f of [30, 60]) { frame(gb, (DUR * f - 1) / f); out[`quadro0_vs_ultimo_${f}fps`] = diff(ga, gb); }
  // passo máximo entre quadros consecutivos (px do centro + lado)
  for (const f of [30, 60]) {
    let mx = 0, at = 0;
    for (let i = 1; i <= DUR * f; i++) { const a = estado((i - 1) / f), b = estado(i / f), d = Math.hypot(b.x - a.x, b.y - a.y); if (d > mx) { mx = d; at = i / f; } }
    out[`maiorPassoPx_${f}fps`] = { px: +mx.toFixed(1), em: +at.toFixed(3) };
  }
  // contact sheet: 6 quadros (estado 0, mola 1 no meio, estado 1 vermelho, mola 2 no meio, estado 2, t=6)
  const T6 = [0, 0.62, 2.2, 2.62, 4.2, 6], sw = 270, sh = 480, lab = 40, sheet = document.createElement('canvas');
  sheet.width = sw * 6 + 5 * 6; sheet.height = sh + lab; const sg = sheet.getContext('2d');
  sg.fillStyle = '#000'; sg.fillRect(0, 0, sheet.width, sheet.height);
  T6.forEach((t, i) => { frame(ga, t); sg.drawImage(ca, i * (sw + 6), 0, sw, sh); sg.font = '500 20px "Geist Mono"'; sg.fillStyle = BRAND.mute; sg.fillText(`t=${t.toFixed(2)} s`, i * (sw + 6) + 10, sh + 28); });
  await salvar('teste1_contact_sheet.png', await png(sheet));
  // passos 30 x 60: contorno de cada quadro na subida da mola 1 (0,50 a 0,90 s)
  const [cp, gp] = [document.createElement('canvas')]; cp.width = 1080; cp.height = 760; const gq = cp.getContext('2d');
  gq.fillStyle = BRAND.ink; gq.fillRect(0, 0, cp.width, cp.height);
  [30, 60].forEach((f, j) => {
    const ox = j * 540, sc = 0.5; gq.font = '700 24px "Geist Mono"'; gq.fillStyle = BRAND.paper; gq.fillText(`${f} fps · 0,50-0,90 s`, ox + 24, 40);
    for (let i = Math.round(0.5 * f); i <= Math.round(0.9 * f); i++) { const e = estado(i / f); gq.strokeStyle = 'rgba(238,237,232,.55)'; gq.lineWidth = 1.5; gq.strokeRect(ox + (e.x - e.s / 2) * sc, (e.y - e.s / 2) * sc - 140, e.s * sc, e.s * sc); }
    gq.fillStyle = BRAND.mute; gq.fillRect(ox + 538 * (j ? 0 : 1), 0, 2, cp.height);
  });
  await salvar('teste1_passos_30x60.png', await png(cp));
  await salvar('teste1_check.json', new Blob([JSON.stringify(out, null, 2)]));
  document.body.insertAdjacentHTML('beforeend', `<pre>${JSON.stringify(out, null, 2)}</pre>`); document.title = 'CHECK OK';
}

async function render() {
  const [cv, g] = novo(), NF = DUR * FPS; let err = null;
  const mux = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: W, height: H, frameRate: FPS }, fastStart: 'in-memory' });
  const ve = new VideoEncoder({ output: (c, m) => mux.addVideoChunk(c, m), error: e => err = e });
  ve.configure({ codec: 'avc1.640032', width: W, height: H, bitrate: 3.2e6, framerate: FPS }); // mesmo bitrate do EpKit nas duas taxas
  for (let f = 0; f < NF; f++) {
    if (err) throw err; frame(g, f / FPS);
    const vf = new VideoFrame(cv, { timestamp: Math.round(f * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    ve.encode(vf, { keyFrame: f % (FPS * 2) === 0 }); vf.close();
    if (ve.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 2));
    document.title = `${f}/${NF}`;
  }
  await ve.flush(); if (err) throw err; mux.finalize();
  const buf = mux.target.buffer, name = `teste1_forma_loop_${FPS}fps.mp4`;
  // confere o mp4 decodificado: primeiro x último quadro
  const res = { arquivo: name, bytes: buf.byteLength, quadros: NF };
  try {
    const v = document.createElement('video'); v.muted = true; v.src = URL.createObjectURL(new Blob([buf], { type: 'video/mp4' }));
    await new Promise((r, j) => { v.onloadeddata = r; v.onerror = () => j(new Error('video')); });
    const grab = async t => { v.currentTime = t; await new Promise(r => v.onseeked = r); const [c, gg] = novo(); gg.drawImage(v, 0, 0, W, H); return gg; };
    const a = await grab(0), b = await grab((NF - 1) / FPS + 0.001);
    res.mp4_primeiro_vs_ultimo = diff(a, b); res.duracaoVideo = v.duration;
  } catch (e) { res.mp4_decod = 'falhou: ' + e.message; }
  await salvar(name, buf);
  await salvar(`teste1_render_${FPS}fps.json`, new Blob([JSON.stringify(res, null, 2)]));
  document.title = 'DONE ' + (buf.byteLength / 1e6).toFixed(2) + ' MB';
}

async function preview() {
  const ts = (q.get('t') || '0').split(',').map(Number);
  for (const t of ts) { const [c, g] = novo(); frame(g, t); c.style.width = '360px'; document.body.append(c); }
  document.title = 'ready';
}

(document.fonts ? loadBrandFonts().catch(() => {}) : Promise.resolve())
  .then(() => q.has('render') ? render() : q.has('check') ? check() : preview())
  .catch(e => { document.title = 'ERROR ' + e.message; salvar('teste1_erro.txt', new Blob([String(e.stack || e)])); });
</script></body></html>
