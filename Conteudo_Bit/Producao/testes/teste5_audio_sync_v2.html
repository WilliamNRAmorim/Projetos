<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Teste 5 v2 · áudio por código</title>
<script src="../brand.js"></script>
<script>document.write(`<link href="${BRAND.fontsCSS}" rel="stylesheet">`);</script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="audio_kit.js"></script>
<style>body{margin:0;background:#0C0C0D;color:#8C8B86;font:13px "Geist Mono",monospace}canvas{display:block;max-width:100%}pre{padding:8px;white-space:pre-wrap}</style>
</head><body>
<script>
// Teste 5 v2: mesmo vídeo do teste 5 (teste5_audio_sync.html), com os dois ajustes pedidos pelo William:
// (a) swoosh DESCENDENTE (pitch em queda) na queda do quadrado (4,4-5,0 s), pico na chegada ao chão, junto com o impacto;
// (b) DUCKING: a trilha abaixa sob os efeitos, em vez de o limitador cortar os efeitos (no teste 5 ele cortava 4,8-5,1 dB nos picos).
// URL: ?t=5 (quadro parado) · ?render=1 (mp4 + json + png + wav em Producao/testes via /save)
const W = 1080, H = 1920, FPS = 30, DUR = 10, GRAO = 0.07;
const q = new URLSearchParams(location.search);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), OMEGA = 14;
const mola = u => u <= 0 ? 0 : 1 - (1 + OMEGA * u) * Math.exp(-OMEGA * u);
const EV = [ // pico de cada efeito em quadro inteiro (120 BPM)
  { nome: 'clique', tipo: 'clique', t: 2.0, nivel: 0.3, visual: 'quadrado vira vermelho e encolhe (troca seca + mola)' },
  { nome: 'swoosh desce', tipo: 'swooshDesce', t: 5.0, dur: 0.6, nivel: 0.24, visual: 'quadrado desce acelerando 4,4-5,0 s; pico na chegada ao chão' },
  { nome: 'impacto', tipo: 'impacto', t: 5.0, nivel: 0.38, visual: 'quadrado para seco na linha do chão' },
  { nome: 'whoosh sobe', tipo: 'whoosh', t: 8.0, nivel: 0.3, visual: 'quadrado sobe acelerando e para no centro (volta ao quadro 0)' },
];
const CHAO = 1300;
function estado(t) { // idêntico ao teste 5
  const x = 540;
  if (t < 2.0 || t >= 8.0) return { x, y: 900, s: 300, red: false };
  if (t < 5.0) { const s = 300 - 100 * mola(t - 2.0), u = clamp((t - 4.4) / 0.6); return { x, y: 900 + (CHAO - s / 2 - 900) * u * u, s, red: true }; }
  if (t < 6.8) return { x, y: CHAO - 100, s: 200, red: false };
  const u = (t - 6.8) / 1.2, e = u * u * u;
  return { x, y: (CHAO - 100) + (900 - (CHAO - 100)) * e, s: 200 + 100 * e, red: false };
}
function frame(g, t, comGrao = true) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = BRAND.ink; g.fillRect(0, 0, W, H);
  g.fillStyle = BRAND.mute; g.fillRect(90, CHAO, 850, 3);
  const e = estado(t); g.fillStyle = e.red ? BRAND.accent : BRAND.paper; g.fillRect(e.x - e.s / 2, e.y - e.s / 2, e.s, e.s);
  if (comGrao) grain(g, W, H, GRAO);
}
async function preview() { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.append(cv); frame(cv.getContext('2d'), +(q.get('t') || 0)); document.title = 'ready'; }
loadBrandFonts().then(() => q.has('render') ? AudioKit.render({ prefixo: 'teste5_audio_sync_v2', W, H, FPS, DUR, frame, eventos: EV, duck: { maxDb: -10, ref: 0.2 },
    extra: { base: 'teste5_audio_sync.html (mesmo vídeo)', comparacaoTeste5: { reducaoLimitadorNoPico_dB: { clique: 0, impacto: -4.79, whoosh: -5.14 } } } }) : preview())
  .catch(e => { document.title = 'ERROR ' + e.message; AudioKit.salvar('teste5_audio_sync_v2_erro.txt', new Blob([String(e.stack || e)])); });
</script>
</body></html>
