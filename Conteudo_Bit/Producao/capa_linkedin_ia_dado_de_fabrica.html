<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>capa linkedin: ia e dado de fabrica</title>
<script src="brand.js"></script>
<script>document.write(`<link rel="stylesheet" href="${BRAND.fontsCSS}">`);</script>
<style>
  /* Capa 1080x1350 do post de LinkedIn "IA perto de dado de fábrica". Render: Edge headless --screenshot --window-size=1080,1350 */
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#0C0C0D}
  .f{position:absolute;inset:0;padding:96px 92px;box-sizing:border-box;color:#EEEDE8;font-family:'Geist',sans-serif;display:flex;flex-direction:column}
  .tag{font-family:'Geist Mono',monospace;font-weight:500;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#8C8B86;display:flex;align-items:center;gap:18px}
  .tag i{display:block;width:14px;height:14px;background:#FF3B1F}
  h1{margin:auto 0 0;font-weight:900;font-size:150px;line-height:.94;letter-spacing:-.045em}
  h1 .p{color:#FF3B1F}
  .rule{height:4px;background:#EEEDE8;width:140px;margin:64px 0 40px}
  .sub{font-weight:700;font-size:46px;line-height:1.15;letter-spacing:-.015em;color:#EEEDE8}
  .foot{margin-top:120px;display:flex;justify-content:space-between;font-family:'Geist Mono',monospace;font-weight:500;font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:#8C8B86}
  canvas{position:absolute;inset:0;pointer-events:none}
</style></head><body>
<div class="f">
  <div class="tag"><i></i>IA perto do chão de fábrica</div>
  <h1>Agentes erram de forma plausível<span class="p">.</span></h1>
  <div class="rule"></div>
  <div class="sub">Dado de fábrica, permissão e prova</div>
  <div class="foot"><span>Candidata, não prova</span></div>
</div>
<canvas id="g" width="1080" height="1350"></canvas>
<script>
  // grão do sistema visual (BRAND/grain de brand.js) por cima de tudo
  const c = document.getElementById('g'), x = c.getContext('2d');
  grain(x, 1080, 1350, 0.10);
  c.style.mixBlendMode = 'overlay';
</script>
</body></html>
